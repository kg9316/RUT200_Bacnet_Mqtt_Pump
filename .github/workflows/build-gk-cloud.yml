name: Build GK Cloud TLS package
# Release 49: persistent device names and actual per-device poll size.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gk-cloud.yml'
      - '.github/workflows/prepare-sdk-base.yml'
      - '.github/workflows/prepare-vuci-cache.yml'
      - '.github/workflows/build-gk-fast.yml'

permissions:
  contents: read

concurrency:
  group: gk-rut2m-full-build
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate-gk-workflows.yml
  sdk:
    needs: validate
    uses: ./.github/workflows/prepare-sdk-base.yml
  vuci:
    needs: sdk
    uses: ./.github/workflows/prepare-vuci-cache.yml
  package:
    needs: vuci
    uses: ./.github/workflows/build-gk-fast.yml

name: 3 - Fast Build GK BACnet MQTT IPK - RUT2M

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fast RUT2M single VuCI package
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      VUCI_CACHE_KEY: gk-sdk-vuci-RUT2M-00.07.24.2-v1

    steps:
      - uses: actions/checkout@v4

      - name: Restore exact prepared VuCI SDK cache
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: sdk
          key: ${{ env.VUCI_CACHE_KEY }}-${{ runner.os }}

      - name: Require prepared SDK
        run: |
          set -euo pipefail
          test "${{ steps.sdk-cache.outputs.cache-hit }}" = "true"
          test -f sdk/include/toplevel.mk
          test -f sdk/tmp/.packageinfo
          test -f sdk/.config
          test -d sdk/package/custom/gk-bacnet-mqtt
          test -d sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-ui
          test -f "$(find sdk/package/teltonika/libs/lib-bacnet -type f -name 'libbacnet.so' | head -1)"

      - name: Get BACnet headers
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/bacnet-stack/bacnet-stack/archive/refs/tags/bacnet-stack-1.3.8.tar.gz -o "$RUNNER_TEMP/bacnet.tar.gz"
          mkdir -p "$RUNNER_TEMP/bacnet-stack"
          tar -xzf "$RUNNER_TEMP/bacnet.tar.gz" -C "$RUNNER_TEMP/bacnet-stack" --strip-components=1

      - name: Cross compile gateway
        run: |
          set -euo pipefail
          SDK="$GITHUB_WORKSPACE/sdk"
          export STAGING_DIR="$SDK/staging_dir"
          BAC="$RUNNER_TEMP/bacnet-stack"
          TOOLCHAIN_DIR="$(find "$SDK/staging_dir" -maxdepth 1 -type d -name 'toolchain-*' | head -1)"
          SYSROOT="$(find "$SDK/staging_dir" -maxdepth 1 -type d -name 'target-*' | head -1)"
          CC="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*-gcc' | head -1)"
          STRIP="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*-strip' | head -1)"
          MOSQDIR="$(find "$SDK/build_dir" -type d -path '*/mosquitto-ssl/mosquitto-2.0.21' | head -1)"
          LIBBACNET="$(find "$SDK/package/teltonika/libs/lib-bacnet" -type f -name 'libbacnet.so' | head -1)"
          test -x "$CC"; test -x "$STRIP"; test -d "$MOSQDIR"; test -f "$LIBBACNET"
          "$CC" -Os --sysroot="$SYSROOT" \
            -I"$GITHUB_WORKSPACE/src" -I"$BAC/src" -I"$BAC/ports/linux" -I"$BAC/ports/posix" -I"$MOSQDIR/include" \
            "$GITHUB_WORKSPACE/src/main.c" "$GITHUB_WORKSPACE/src/util.c" \
            "$GITHUB_WORKSPACE/src/device_table.c" "$GITHUB_WORKSPACE/src/mqtt_client.c" \
            "$GITHUB_WORKSPACE/src/bacnet_client.c" "$GITHUB_WORKSPACE/src/status.c" \
            "$LIBBACNET" "$MOSQDIR/lib/libmosquitto.so.1" \
            -L"$SDK/staging_dir/usr/lib" -Wl,-rpath,/usr/lib -Wl,-rpath-link,"$SDK/staging_dir/usr/lib" \
            -pthread -lrt -lm -latomic -o "$GITHUB_WORKSPACE/gk-bacnet-mqtt"
          "$STRIP" "$GITHUB_WORKSPACE/gk-bacnet-mqtt"
          readelf -d "$GITHUB_WORKSPACE/gk-bacnet-mqtt" | grep -qi libbacnet

      - name: Restore known-good cached package graph and inject runtime
        run: |
          set -euo pipefail
          CORE=sdk/package/custom/gk-bacnet-mqtt
          UI=sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-ui

          # Keep SDK-side Makefiles byte-compatible with the package graph that
          # produced the last known-good fast build (run 33208183825).
          cat > "$CORE/Makefile" <<'MAKE'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=gk-bacnet-mqtt
          PKG_VERSION:=1.0.0
          PKG_RELEASE:=9

          include $(INCLUDE_DIR)/package.mk

          define Package/gk-bacnet-mqtt
            SECTION:=utils
            CATEGORY:=Utilities
            TITLE:=GK BACnet to MQTT Gateway
            DEPENDS:=+libmosquitto-ssl +libatomic +lib-bacnet +api-core
          endef

          define Package/gk-bacnet-mqtt/description
           Native BACnet/IP to MQTT gateway for Teltonika RUT2M RutOS devices.
           Includes the gateway daemon, UCI configuration, VuCI API and compiled VuCI UI.
           Uses the Teltonika lib-bacnet runtime package matching RUT2M_R_00.07.24.2.
          endef

          define Build/Compile
          endef

          define Package/gk-bacnet-mqtt/install
          	$(INSTALL_DIR) $(1)/usr/sbin
          	$(INSTALL_BIN) ./files/gk-bacnet-mqtt $(1)/usr/sbin/gk-bacnet-mqtt
          	$(INSTALL_DIR) $(1)/etc/config
          	$(INSTALL_CONF) ./files/gk-bacnet-mqtt.config $(1)/etc/config/gk_bacnet_mqtt
          	$(INSTALL_DIR) $(1)/etc/init.d
          	$(INSTALL_BIN) ./files/gk-bacnet-mqtt.init $(1)/etc/init.d/gk-bacnet-mqtt
          	$(INSTALL_DIR) $(1)/usr/lib/lua/api/services
          	$(CP) ./runtime/api/services/*.lua $(1)/usr/lib/lua/api/services/
          	$(INSTALL_DIR) $(1)/usr/share/vuci/path.d
          	$(CP) ./runtime/vuci/path.d/*.json $(1)/usr/share/vuci/path.d/
          	$(INSTALL_DIR) $(1)/usr/share/rpcd/acl.d
          	$(CP) ./runtime/rpcd/acl.d/*.json $(1)/usr/share/rpcd/acl.d/
          	$(INSTALL_DIR) $(1)/usr/share/vuci/menu.d
          	$(CP) ./runtime/vuci/menu.d/*.json $(1)/usr/share/vuci/menu.d/
          	if [ -d ./runtime/www ]; then \
          		$(INSTALL_DIR) $(1)/www; \
          		$(CP) ./runtime/www/* $(1)/www/; \
          	fi
          endef

          define Package/gk-bacnet-mqtt/postinst
          #!/bin/sh
          ROOT="$${IPKG_INSTROOT:-}"
          if [ -z "$$ROOT" ] || [ "$$ROOT" = "/usr/local" ]; then
          	/etc/init.d/rpcd restart >/dev/null 2>&1 || true
          fi
          exit 0
          endef

          $(eval $(call BuildPackage,gk-bacnet-mqtt))
          MAKE

          cat > "$UI/Makefile" <<'MAKE'
          include $(TOPDIR)/rules.mk

          APP_TITLE:=GK BACnet MQTT
          APP_NAME:=$(notdir ${CURDIR})
          APP_DEPENDS:=+gk-bacnet-mqtt
          CLOSED_GPL_INSTALL:=y

          PKG_VERSION:=1.0.0
          PKG_RELEASE:=6

          ifneq (,$(filter m,$(CONFIG_PACKAGE_$(APP_NAME)))$(DUMP))
          	APP_TLT_NAME:=GK BACnet MQTT
          	APP_ROUTER:=$(TLT_PLATFORM_NAME)
          endif

          define Package/$(APP_NAME)/description
          	GK BACnet MQTT configuration, runtime status and log UI.
          endef

          include ../app.mk

          # call BuildPackage - OpenWrt buildroot signature
          MAKE

          rsync -a --delete package/gk-bacnet-mqtt/files/ "$CORE/files/"
          cp gk-bacnet-mqtt "$CORE/files/gk-bacnet-mqtt"

          # Sync current UI sources/assets but keep the compatibility Makefile above.
          rsync -a --delete --exclude Makefile package/vuci-app-gk-bacnet-mqtt-ui/ "$UI/"

          # Core dependency must remain buildable because the cached graph traverses it.
          rm -rf "$CORE/runtime"
          mkdir -p "$CORE/runtime/api/services" "$CORE/runtime/vuci/path.d" "$CORE/runtime/vuci/menu.d" "$CORE/runtime/rpcd/acl.d"
          cp package/vuci-app-gk-bacnet-mqtt-api/files/usr/lib/lua/api/services/*.lua "$CORE/runtime/api/services/"
          cp package/vuci-app-gk-bacnet-mqtt-api/files/usr/share/vuci/path.d/*.json "$CORE/runtime/vuci/path.d/"
          cp package/vuci-app-gk-bacnet-mqtt-api/files/usr/share/rpcd/acl.d/*.json "$CORE/runtime/rpcd/acl.d/"
          cp package/vuci-app-gk-bacnet-mqtt-ui/files/usr/share/vuci/menu.d/*.json "$CORE/runtime/vuci/menu.d/"

          # The final physical UI IPK receives the complete runtime payload.
          mkdir -p "$UI/files/usr/sbin" "$UI/files/etc/config" "$UI/files/etc/init.d" \
                   "$UI/files/usr/lib/lua/api/services" "$UI/files/usr/share/vuci/path.d" "$UI/files/usr/share/rpcd/acl.d"
          cp gk-bacnet-mqtt "$UI/files/usr/sbin/gk-bacnet-mqtt"
          chmod 0755 "$UI/files/usr/sbin/gk-bacnet-mqtt"
          cp package/gk-bacnet-mqtt/files/gk-bacnet-mqtt.config "$UI/files/etc/config/gk_bacnet_mqtt"
          cp package/gk-bacnet-mqtt/files/gk-bacnet-mqtt.init "$UI/files/etc/init.d/gk-bacnet-mqtt"
          chmod 0755 "$UI/files/etc/init.d/gk-bacnet-mqtt"
          cp package/vuci-app-gk-bacnet-mqtt-api/files/usr/lib/lua/api/services/*.lua "$UI/files/usr/lib/lua/api/services/"
          cp package/vuci-app-gk-bacnet-mqtt-api/files/usr/share/vuci/path.d/*.json "$UI/files/usr/share/vuci/path.d/"
          cp package/vuci-app-gk-bacnet-mqtt-api/files/usr/share/rpcd/acl.d/*.json "$UI/files/usr/share/rpcd/acl.d/"

          find sdk/bin/packages -type f \( -name 'gk-bacnet-mqtt_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-api_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-ui_*.ipk' -o -name 'gk_bacnet_mqtt.tar.gz' \) -delete 2>/dev/null || true

      - name: Pin cached VuCI core
        run: |
          set -euo pipefail
          VUCI_CORE="$(find sdk/build_dir -type d -name 'vuci-ui-core-*' | head -1)"
          test -f "$VUCI_CORE/.built"
          touch "$VUCI_CORE/.built"
          CORE_INSTALL_STAMP="$(find sdk/staging_dir -type f -name '.vuci-ui-core_installed' | head -1 || true)"
          if [ -n "$CORE_INSTALL_STAMP" ]; then touch "$CORE_INSTALL_STAMP"; fi
          rm -f sdk/tmp/.pkg-rebuilt

      - name: Build UI with known-good target graph
        working-directory: sdk
        run: |
          set -euo pipefail
          make package/vuci-app-gk-bacnet-mqtt-ui/compile -j2 V=s
          UI_IPK="$(find bin/packages -type f -name 'vuci-app-gk-bacnet-mqtt-ui_*.ipk' | head -1)"
          test -f "$UI_IPK"
          echo "Built: $UI_IPK"

      - name: Convert built UI IPK to standalone runtime IPK
        working-directory: sdk
        run: |
          set -euo pipefail
          UI_IPK="$(find bin/packages -type f -name 'vuci-app-gk-bacnet-mqtt-ui_*.ipk' | head -1)"
          PKGROOT="$(find build_dir -type d -path '*/ipkg-mipsel_24kc/vuci-app-gk-bacnet-mqtt-ui' | head -1)"
          test -f "$UI_IPK"
          test -d "$PKGROOT"
          test -f "$PKGROOT/CONTROL/control"

          python3 - "$PKGROOT/CONTROL/control" <<'PY'
          import sys
          p = sys.argv[1]
          lines = open(p).read().splitlines()
          out = []
          for line in lines:
              if line.startswith('Version:'):
                  line = 'Version: 1.0.0-7'
              elif line.startswith('Depends:'):
                  line = 'Depends: libc, libmosquitto-ssl, libatomic1, lib-bacnet, api-core, vuci-ui-core'
              elif line.startswith('Description:'):
                  line = 'Description:  GK BACnet to MQTT gateway. Single RutOS package containing daemon, UCI config, API and VuCI UI.'
              out.append(line)
          open(p, 'w').write('\n'.join(out) + '\n')
          PY

          OUTDIR="$(dirname "$UI_IPK")"
          rm -f "$UI_IPK"
          test -x staging_dir/host/bin/fakeroot
          test -x scripts/ipkg-build
          staging_dir/host/bin/fakeroot scripts/ipkg-build -m "" "$PKGROOT" "$OUTDIR"

          UI_IPK="$(find "$OUTDIR" -maxdepth 1 -type f -name 'vuci-app-gk-bacnet-mqtt-ui_1.0.0-7_*.ipk' | head -1)"
          test -f "$UI_IPK"

          TMP="$(mktemp -d)"
          if gzip -t "$UI_IPK" 2>/dev/null; then tar -xzf "$UI_IPK" -C "$TMP"; else (cd "$TMP" && ar x "$(realpath "$UI_IPK")"); fi
          mkdir -p "$TMP/data" "$TMP/control"
          tar -xzf "$TMP/data.tar.gz" -C "$TMP/data"
          tar -xzf "$TMP/control.tar.gz" -C "$TMP/control"
          echo '=== FINAL UI IPK CONTROL ==='
          cat "$TMP/control/control"
          grep -q '^Depends: libc, libmosquitto-ssl, libatomic1, lib-bacnet, api-core, vuci-ui-core$' "$TMP/control/control"
          ! grep -q 'vuci-app-gk-bacnet-mqtt-api' "$TMP/control/control"
          ! grep '^Depends:' "$TMP/control/control" | grep -q 'gk-bacnet-mqtt'
          test -x "$TMP/data/usr/sbin/gk-bacnet-mqtt"
          test -f "$TMP/data/etc/config/gk_bacnet_mqtt"
          test -x "$TMP/data/etc/init.d/gk-bacnet-mqtt"
          test -f "$TMP/data/usr/lib/lua/api/services/gk_bacnet_mqtt_config.lua"
          test -f "$TMP/data/usr/lib/lua/api/services/gk_bacnet_mqtt_status.lua"
          test -f "$TMP/data/usr/share/vuci/path.d/gk-bacnet-mqtt.json"
          test -f "$TMP/data/usr/share/rpcd/acl.d/gk-bacnet-mqtt.json"
          test -f "$TMP/data/usr/share/vuci/menu.d/gk-bacnet-mqtt.json"
          test -d "$TMP/data/www/views"
          test -n "$(find "$TMP/data/www/views" -type f | head -1)"
          rm -rf "$TMP"

          find bin/packages -type f \( -name 'gk-bacnet-mqtt_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-api_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-ui_1.0.0-6_*.ipk' \) -delete

      - name: Build Package Manager bundle using accepted VuCI root
        working-directory: sdk
        run: |
          set -euo pipefail
          cp ipk_packages.json "$RUNNER_TEMP/ipk_packages.full.json"
          trap 'cp "$RUNNER_TEMP/ipk_packages.full.json" ipk_packages.json' EXIT
          cat > ipk_packages.json <<'JSON'
          {
            "vuci-app-gk-bacnet-mqtt-ui": {
              "name": "gk_bacnet_mqtt"
            }
          }
          JSON
          USIGN="staging_dir/host/bin/usign"
          test -x "$USIGN"
          rm -f key-build key-build.pub
          "$USIGN" -G -p key-build.pub -s key-build
          make -j1 pm V=s
          PM_BUNDLE="$(find bin/packages -type f -path '*/zipped_packages/gk_bacnet_mqtt.tar.gz' | head -1)"
          test -f "$PM_BUNDLE"
          LIST="$(tar -tzf "$PM_BUNDLE")"
          printf '%s\n' "$LIST"
          test "$(printf '%s\n' "$LIST" | grep -c '^\./vuci-app-gk-bacnet-mqtt-ui_.*\.ipk$')" -eq 1
          test "$(printf '%s\n' "$LIST" | grep -c '\.ipk$')" -eq 1
          printf '%s\n' "$LIST" | grep -qx 'main'
          printf '%s\n' "$LIST" | grep -qx 'main.sig'
          ! printf '%s\n' "$LIST" | grep -q 'vuci-app-gk-bacnet-mqtt-api'
          ! printf '%s\n' "$LIST" | grep -q '^\./gk-bacnet-mqtt_'
          cp "$RUNNER_TEMP/ipk_packages.full.json" ipk_packages.json
          trap - EXIT

      - name: Return only the RutOS Package Manager file
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          PM_BUNDLE="$(find sdk/bin/packages -type f -path '*/zipped_packages/gk_bacnet_mqtt.tar.gz' | head -1)"
          cp "$PM_BUNDLE" dist/gk_bacnet_mqtt.tar.gz
          gzip -t dist/gk_bacnet_mqtt.tar.gz
          test "$(tar -tzf dist/gk_bacnet_mqtt.tar.gz | grep -c '\.ipk$')" -eq 1
          tar -tzf dist/gk_bacnet_mqtt.tar.gz
          ls -lh dist/gk_bacnet_mqtt.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: gk_bacnet_mqtt-RUT2M-${{ github.sha }}
          path: dist/gk_bacnet_mqtt.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

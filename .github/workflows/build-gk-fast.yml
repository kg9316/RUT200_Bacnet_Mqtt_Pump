name: 3 - Fast Build GK BACnet MQTT IPKs - RUT2M

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fast RUT2M
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      VUCI_CACHE_KEY: gk-sdk-vuci-RUT2M-00.07.24.2-v1

    steps:
      - uses: actions/checkout@v4

      - name: Restore exact prepared VuCI SDK cache
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: sdk
          key: ${{ env.VUCI_CACHE_KEY }}-${{ runner.os }}

      - name: Require exact prepared VuCI cache
        run: |
          set -euo pipefail
          test "${{ steps.sdk-cache.outputs.cache-hit }}" = "true"
          test -f sdk/include/toplevel.mk
          test -f sdk/ipk_packages.json
          test -f sdk/tmp/.packageinfo
          test -f sdk/.config

          grep -q '^Package: gk-bacnet-mqtt$' sdk/tmp/.packageinfo
          grep -q '^Package: vuci-app-gk-bacnet-mqtt-api$' sdk/tmp/.packageinfo
          grep -q '^Package: vuci-app-gk-bacnet-mqtt-ui$' sdk/tmp/.packageinfo
          grep -q '^CONFIG_PACKAGE_gk-bacnet-mqtt=m' sdk/.config
          grep -q '^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-api=m' sdk/.config
          grep -q '^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-ui=m' sdk/.config

          test -f "$(find sdk/package/teltonika/libs/lib-bacnet -type f -name 'libbacnet.so' | head -1)"
          VUCI_CORE="$(find sdk/build_dir -type d -name 'vuci-ui-core-*' | head -1)"
          test -n "$VUCI_CORE"
          test -d "$VUCI_CORE"

          TOOLCHAIN_DIR="$(find sdk/staging_dir -maxdepth 1 -type d -name 'toolchain-*' | head -1)"
          CC="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*-gcc' | head -1)"
          test -x "$CC"

          echo "Using exact cache: ${{ env.VUCI_CACHE_KEY }}-${{ runner.os }}"
          echo "Using cached VuCI core: $VUCI_CORE"
          echo "Using cached toolchain: $TOOLCHAIN_DIR"

      - name: Get BACnet headers
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/bacnet-stack/bacnet-stack/archive/refs/tags/bacnet-stack-1.3.8.tar.gz -o "$RUNNER_TEMP/bacnet.tar.gz"
          mkdir -p "$RUNNER_TEMP/bacnet-stack"
          tar -xzf "$RUNNER_TEMP/bacnet.tar.gz" -C "$RUNNER_TEMP/bacnet-stack" --strip-components=1

      - name: Cross compile gateway only
        run: |
          set -euo pipefail
          SDK="$GITHUB_WORKSPACE/sdk"
          export STAGING_DIR="$SDK/staging_dir"
          BAC="$RUNNER_TEMP/bacnet-stack"
          TOOLCHAIN_DIR="$(find "$SDK/staging_dir" -maxdepth 1 -type d -name 'toolchain-*' | head -1)"
          SYSROOT="$(find "$SDK/staging_dir" -maxdepth 1 -type d -name 'target-*' | head -1)"
          CC="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*-gcc' | head -1)"
          STRIP="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*-strip' | head -1)"
          MOSQDIR="$(find "$SDK/build_dir" -type d -path '*/mosquitto-ssl/mosquitto-2.0.21' | head -1)"
          LIBBACNET="$(find "$SDK/package/teltonika/libs/lib-bacnet" -type f -name 'libbacnet.so' | head -1)"

          test -x "$CC"
          test -x "$STRIP"
          test -d "$SYSROOT"
          test -f "$MOSQDIR/lib/libmosquitto.so.1"
          test -f "$LIBBACNET"

          "$CC" -Os --sysroot="$SYSROOT" \
            -I"$GITHUB_WORKSPACE/src" -I"$BAC/src" -I"$BAC/ports/linux" -I"$BAC/ports/posix" -I"$MOSQDIR/include" \
            "$GITHUB_WORKSPACE/src/main.c" \
            "$GITHUB_WORKSPACE/src/util.c" \
            "$GITHUB_WORKSPACE/src/device_table.c" \
            "$GITHUB_WORKSPACE/src/mqtt_client.c" \
            "$GITHUB_WORKSPACE/src/bacnet_client.c" \
            "$GITHUB_WORKSPACE/src/status.c" \
            "$LIBBACNET" "$MOSQDIR/lib/libmosquitto.so.1" \
            -L"$SDK/staging_dir/usr/lib" \
            -Wl,-rpath,/usr/lib -Wl,-rpath-link,"$SDK/staging_dir/usr/lib" \
            -pthread -lrt -lm -latomic \
            -o "$GITHUB_WORKSPACE/gk-bacnet-mqtt"

          "$STRIP" "$GITHUB_WORKSPACE/gk-bacnet-mqtt"
          readelf -d "$GITHUB_WORKSPACE/gk-bacnet-mqtt" | grep -qi libbacnet
          echo "Core binary: $(stat -c%s "$GITHUB_WORKSPACE/gk-bacnet-mqtt") bytes"

      - name: Update only GK package sources
        run: |
          set -euo pipefail

          test -d sdk/package/custom/gk-bacnet-mqtt
          test -d sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-api
          test -d sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-ui

          cp package/build-shims/lib-bacnet/Makefile sdk/package/custom/lib-bacnet/Makefile
          cp package/gk-bacnet-mqtt/Makefile sdk/package/custom/gk-bacnet-mqtt/Makefile
          rsync -a --delete package/gk-bacnet-mqtt/files/ sdk/package/custom/gk-bacnet-mqtt/files/
          cp gk-bacnet-mqtt sdk/package/custom/gk-bacnet-mqtt/files/gk-bacnet-mqtt

          rsync -a --delete package/vuci-app-gk-bacnet-mqtt-api/ sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-api/
          rsync -a --delete package/vuci-app-gk-bacnet-mqtt-ui/ sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-ui/

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('sdk/ipk_packages.json').read_text())
          entry = data.get('vuci-app-gk-bacnet-mqtt-ui')
          assert entry, 'missing vuci-app-gk-bacnet-mqtt-ui in ipk_packages.json'
          assert entry.get('name') == 'gk_bacnet_mqtt', entry
          assert entry.get('vuci_dep') == 'vuci-app-gk-bacnet-mqtt-api', entry
          PY

          find sdk/bin/packages -type f \
            \( -name 'gk-bacnet-mqtt_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-api_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-ui_*.ipk' -o -name 'gk_bacnet_mqtt.tar.gz' \) \
            -delete 2>/dev/null || true

      - name: Verify prepared metadata is still intact
        run: |
          set -euo pipefail
          grep -q '^Package: gk-bacnet-mqtt$' sdk/tmp/.packageinfo
          grep -q '^Package: vuci-app-gk-bacnet-mqtt-api$' sdk/tmp/.packageinfo
          grep -q '^Package: vuci-app-gk-bacnet-mqtt-ui$' sdk/tmp/.packageinfo
          grep -q '^CONFIG_PACKAGE_gk-bacnet-mqtt=m' sdk/.config
          grep -q '^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-api=m' sdk/.config
          grep -q '^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-ui=m' sdk/.config
          echo 'Prepared SDK metadata preserved.'

      - name: Build only GK packages
        working-directory: sdk
        run: |
          set -euo pipefail
          make package/gk-bacnet-mqtt/compile -j2 V=s
          make package/vuci-app-gk-bacnet-mqtt-api/compile -j2 V=s
          make package/vuci-app-gk-bacnet-mqtt-ui/compile -j2 V=s

      - name: Build GK-only Teltonika Package Manager bundle
        working-directory: sdk
        run: |
          set -euo pipefail

          cp ipk_packages.json "$RUNNER_TEMP/ipk_packages.full.json"
          trap 'cp "$RUNNER_TEMP/ipk_packages.full.json" ipk_packages.json' EXIT

          python3 - <<'PY'
          import json
          from pathlib import Path

          src = json.loads(Path('ipk_packages.json').read_text())
          entry = src.get('vuci-app-gk-bacnet-mqtt-ui')
          assert entry, 'missing GK UI Package Manager entry'
          assert entry.get('name') == 'gk_bacnet_mqtt', entry
          assert entry.get('vuci_dep') == 'vuci-app-gk-bacnet-mqtt-api', entry

          Path('ipk_packages.json').write_text(
              json.dumps({'vuci-app-gk-bacnet-mqtt-ui': entry}, indent=2) + '\n'
          )
          PY

          echo 'Package Manager input:'
          cat ipk_packages.json

          make pm V=s

          PM_BUNDLE="$(find bin/packages -type f -path '*/zipped_packages/gk_bacnet_mqtt.tar.gz' | head -1)"
          test -f "$PM_BUNDLE"
          echo "GK-only Package Manager bundle: $PM_BUNDLE"
          tar -tzf "$PM_BUNDLE"

          cp "$RUNNER_TEMP/ipk_packages.full.json" ipk_packages.json
          trap - EXIT

      - name: Collect and verify packages
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist

          find sdk/bin/packages -type f \
            \( -name 'gk-bacnet-mqtt_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-api_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-ui_*.ipk' \) \
            -exec cp -v {} dist/ \;
          find sdk/bin/packages -type f -path '*/zipped_packages/gk_bacnet_mqtt.tar.gz' \
            -exec cp -v {} dist/ \;

          test "$(find dist -maxdepth 1 -name '*.ipk' | wc -l)" -eq 3
          test -f dist/gk_bacnet_mqtt.tar.gz

          verify_ipk_data() {
            ipk="$1"
            out="$2"
            mkdir -p "$out"
            if gzip -t "$ipk" 2>/dev/null; then
              tar -xzf "$ipk" -C "$out"
            else
              (cd "$out" && ar x "$(realpath "$ipk")")
            fi
            mkdir -p "$out/data"
            tar -xzf "$out/data.tar.gz" -C "$out/data"
          }

          CORE_IPK="$(find dist -maxdepth 1 -name 'gk-bacnet-mqtt_*.ipk' | head -1)"
          CORE_TMP="$(mktemp -d)"
          verify_ipk_data "$CORE_IPK" "$CORE_TMP"
          test -x "$CORE_TMP/data/usr/sbin/gk-bacnet-mqtt"
          test -f "$CORE_TMP/data/etc/config/gk-bacnet-mqtt"
          test -x "$CORE_TMP/data/etc/init.d/gk-bacnet-mqtt"
          rm -rf "$CORE_TMP"

          UI_IPK="$(find dist -maxdepth 1 -name 'vuci-app-gk-bacnet-mqtt-ui_*.ipk' | head -1)"
          UI_TMP="$(mktemp -d)"
          verify_ipk_data "$UI_IPK" "$UI_TMP"
          echo '=== UI package files ==='
          find "$UI_TMP/data" -type f | sort
          test -d "$UI_TMP/data/www/views"
          test -n "$(find "$UI_TMP/data/www/views" -type f | head -1)"
          rm -rf "$UI_TMP"

      - name: Normalize raw IPKs for direct opkg install
        run: |
          set -euo pipefail
          for ipk in dist/*.ipk; do
            if gzip -t "$ipk" 2>/dev/null; then
              continue
            fi
            tmp="$(mktemp -d)"
            abs_ipk="$(realpath "$ipk")"
            (
              cd "$tmp"
              ar x "$abs_ipk"
              printf '2.0\n' > debian-binary
              members=(./debian-binary ./data.tar.gz ./control.tar.gz)
              if test -f control+data.sig; then members+=(./control+data.sig); fi
              tar -czf "$abs_ipk.new" "${members[@]}"
            )
            mv "$abs_ipk.new" "$abs_ipk"
            rm -rf "$tmp"
          done
          file dist/*.ipk dist/gk_bacnet_mqtt.tar.gz
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: gk-bacnet-mqtt-RUT2M-fast-${{ github.sha }}
          path: |
            dist/*.ipk
            dist/gk_bacnet_mqtt.tar.gz
          if-no-files-found: error
          retention-days: 30

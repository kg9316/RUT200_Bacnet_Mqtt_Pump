name: Fast Build GK BACnet MQTT IPKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: RUT2M
            cache_key: gk-prepared-sdk-RUT2M-00.07.24.2-v2-vuci
            firmware: RUT2M_R_GPL_00.07.24.2
          - target: RUT14X
            cache_key: gk-prepared-sdk-RUT14X-00.07.24.2-v2-vuci
            firmware: RUT14X_R_GPL_00.07.24.2

    steps:
      - uses: actions/checkout@v4

      - name: Restore refreshed RutOS SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: sdk
          key: ${{ matrix.cache_key }}-${{ runner.os }}

      - name: Verify fast-build SDK
        run: |
          set -euo pipefail
          echo "Target=${{ matrix.target }} cache-hit=${{ steps.sdk-cache.outputs.cache-hit }}"
          test "${{ steps.sdk-cache.outputs.cache-hit }}" = "true"
          test -d sdk/staging_dir
          test -x sdk/scripts/ipkg-build
          TOOLCHAIN_DIR="$(find sdk/staging_dir -maxdepth 1 -type d -name 'toolchain-*' | head -1)"
          SYSROOT="$(find sdk/staging_dir -maxdepth 1 -type d -name 'target-*' | head -1)"
          MOSQDIR="$(find sdk/build_dir -type d -path '*/mosquitto-ssl/mosquitto-2.0.21' | head -1)"
          LIBBACNET="$(find sdk/package/teltonika/libs/lib-bacnet -type f -path '*/usr/lib/libbacnet.so' | head -1)"
          SSTRIP="$(find sdk/staging_dir -type f -name 'sstrip' -perm -111 | head -1)"
          test -n "$TOOLCHAIN_DIR"
          test -n "$SYSROOT"
          test -n "$MOSQDIR"
          test -f "$MOSQDIR/lib/libmosquitto.so.1"
          test -f "$LIBBACNET"
          test -x "$SSTRIP"

      - name: Get BACnet Stack 1.3.8 headers
        run: |
          set -euo pipefail
          curl -fL --retry 4 https://github.com/bacnet-stack/bacnet-stack/archive/refs/tags/bacnet-stack-1.3.8.tar.gz -o "$RUNNER_TEMP/bacnet.tar.gz"
          mkdir -p "$RUNNER_TEMP/bacnet-stack"
          tar -xzf "$RUNNER_TEMP/bacnet.tar.gz" -C "$RUNNER_TEMP/bacnet-stack" --strip-components=1

      - name: Cross compile and RutOS-strip GK gateway
        run: |
          set -euo pipefail
          SDK="$GITHUB_WORKSPACE/sdk"
          export STAGING_DIR="$SDK/staging_dir"
          BAC="$RUNNER_TEMP/bacnet-stack"
          TOOLCHAIN_DIR="$(find "$SDK/staging_dir" -maxdepth 1 -type d -name 'toolchain-*' | head -1)"
          SYSROOT="$(find "$SDK/staging_dir" -maxdepth 1 -type d -name 'target-*' | head -1)"
          CC="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*-gcc' | head -1)"
          STRIP="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*-strip' | head -1)"
          SSTRIP="$(find "$SDK/staging_dir" -type f -name 'sstrip' -perm -111 | head -1)"
          MOSQDIR="$(find "$SDK/build_dir" -type d -path '*/mosquitto-ssl/mosquitto-2.0.21' | head -1)"
          LIBBACNET="$(find "$SDK/package/teltonika/libs/lib-bacnet" -type f -path '*/usr/lib/libbacnet.so' | head -1)"
          test -x "$CC"
          test -x "$STRIP"
          test -x "$SSTRIP"
          test -d "$SYSROOT"
          test -f "$MOSQDIR/lib/libmosquitto.so.1"
          test -f "$LIBBACNET"
          "$CC" -Os --sysroot="$SYSROOT" \
            -I"$GITHUB_WORKSPACE/src" -I"$BAC/src" -I"$MOSQDIR/include" \
            "$GITHUB_WORKSPACE/src/main.c" \
            "$GITHUB_WORKSPACE/src/util.c" \
            "$GITHUB_WORKSPACE/src/device_table.c" \
            "$GITHUB_WORKSPACE/src/mqtt_client.c" \
            "$GITHUB_WORKSPACE/src/bacnet_client.c" \
            "$GITHUB_WORKSPACE/src/status.c" \
            "$LIBBACNET" "$MOSQDIR/lib/libmosquitto.so.1" \
            -L"$SDK/staging_dir/usr/lib" \
            -Wl,-rpath,/usr/lib -Wl,-rpath-link,"$SDK/staging_dir/usr/lib" \
            -latomic -o "$GITHUB_WORKSPACE/gk-bacnet-mqtt"
          echo "=== linked libraries ==="
          readelf -d "$GITHUB_WORKSPACE/gk-bacnet-mqtt" | grep NEEDED
          readelf -d "$GITHUB_WORKSPACE/gk-bacnet-mqtt" | grep -q 'libbacnet.so'
          readelf -d "$GITHUB_WORKSPACE/gk-bacnet-mqtt" | grep -q 'libmosquitto.so.1'
          readelf -d "$GITHUB_WORKSPACE/gk-bacnet-mqtt" | grep -q 'libatomic.so.1'
          "$STRIP" "$GITHUB_WORKSPACE/gk-bacnet-mqtt"
          "$SSTRIP" "$GITHUB_WORKSPACE/gk-bacnet-mqtt"
          file "$GITHUB_WORKSPACE/gk-bacnet-mqtt"
          ls -lh "$GITHUB_WORKSPACE/gk-bacnet-mqtt"

      - name: Fast-package three IPKs
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          set -euo pipefail
          ARCH="$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\([^"]*\)"/\1/p' sdk/.config | head -1)"
          if [ -z "$ARCH" ]; then
            ARCH="$(basename "$(find sdk/bin/packages -mindepth 1 -maxdepth 1 -type d | head -1)")"
          fi
          test -n "$ARCH"
          ROOT="$RUNNER_TEMP/gk-ipk-stage"
          rm -rf "$ROOT" dist
          mkdir -p "$ROOT" dist

          write_control() {
            local dir="$1" pkg="$2" ver="$3" deps="$4" source="$5" section="$6" title="$7" desc="$8"
            mkdir -p "$dir/CONTROL"
            local size
            size="$(du -sb "$dir" | awk '{print $1}')"
            printf '%s\n' \
              "Package: $pkg" \
              "Version: $ver" \
              "Depends: $deps" \
              "Source: package/custom/$source" \
              "SourceName: $source" \
              "License: UNKNOWN" \
              "Section: $section" \
              "Architecture: $ARCH" \
              "Installed-Size: $size" \
              "Firmware: $FIRMWARE" \
              "Description: $title" \
              " $desc" > "$dir/CONTROL/control"
          }

          write_prerm() {
            printf '%s\n' '#!/bin/sh' '[ -s ${IPKG_INSTROOT}/lib/functions.sh ] || exit 0' '. ${IPKG_INSTROOT}/lib/functions.sh' 'default_prerm $0 $@' > "$1/CONTROL/prerm"
            chmod 0755 "$1/CONTROL/prerm"
          }

          write_postrm() {
            printf '%s\n' '#!/bin/sh' '[ -s ${IPKG_INSTROOT}/lib/functions.sh ] || exit 0' '. ${IPKG_INSTROOT}/lib/functions.sh' 'default_postrm $0 $@' > "$1/CONTROL/postrm"
            chmod 0755 "$1/CONTROL/postrm"
          }

          CORE="$ROOT/core"
          mkdir -p "$CORE/usr/sbin" "$CORE/etc/config" "$CORE/etc/init.d"
          install -m0755 gk-bacnet-mqtt "$CORE/usr/sbin/gk-bacnet-mqtt"
          install -m0644 package/gk-bacnet-mqtt/files/gk-bacnet-mqtt.config "$CORE/etc/config/gk-bacnet-mqtt"
          install -m0755 package/gk-bacnet-mqtt/files/gk-bacnet-mqtt.init "$CORE/etc/init.d/gk-bacnet-mqtt"
          write_control "$CORE" gk-bacnet-mqtt 1.0.0-2 'libc, lib-bacnet, libmosquitto-ssl, libatomic1' gk-bacnet-mqtt utils 'GK BACnet to MQTT Gateway' 'Native BACnet/IP to MQTT gateway for supported Teltonika RutOS devices. Uses the official Teltonika lib-bacnet runtime package.'
          printf '%s\n' '/etc/config/gk-bacnet-mqtt' > "$CORE/CONTROL/conffiles"
          printf '%s\n' '#!/bin/sh' '[ "${IPKG_NO_SCRIPT}" = "1" ] && exit 0' '[ -s ${IPKG_INSTROOT}/lib/functions.sh ] || exit 0' '. ${IPKG_INSTROOT}/lib/functions.sh' 'default_postinst $0 $@' > "$CORE/CONTROL/postinst"
          chmod 0755 "$CORE/CONTROL/postinst"
          write_prerm "$CORE"

          API="$ROOT/api"
          mkdir -p "$API"
          cp -a package/vuci-app-gk-bacnet-mqtt-api/files/. "$API/"
          write_control "$API" vuci-app-gk-bacnet-mqtt-api 1.0.0-1 'libc, gk-bacnet-mqtt, api-core' vuci-app-gk-bacnet-mqtt-api vuci 'GK BACnet MQTT API' 'Runtime status, configuration and log API for GK BACnet MQTT.'
          printf '%s\n' '#!/bin/sh' '[ "${IPKG_NO_SCRIPT}" = "1" ] && exit 0' '[ -s ${IPKG_INSTROOT}/lib/functions.sh ] || exit 0' '. ${IPKG_INSTROOT}/lib/functions.sh' 'default_postinst $0 $@' '[ -z "${IPKG_INSTROOT}" ] || exit 0' '[ -x /etc/init.d/rpcd ] && /etc/init.d/rpcd restart' > "$API/CONTROL/postinst"
          chmod 0755 "$API/CONTROL/postinst"
          write_prerm "$API"
          write_postrm "$API"

          UI="$ROOT/ui"
          mkdir -p "$UI"
          cp -a package/vuci-app-gk-bacnet-mqtt-ui/files/. "$UI/"
          write_control "$UI" vuci-app-gk-bacnet-mqtt-ui 1.0.0-1 'libc, gk-bacnet-mqtt, vuci-app-gk-bacnet-mqtt-api' vuci-app-gk-bacnet-mqtt-ui vuci 'GK BACnet MQTT UI' 'GK BACnet MQTT configuration, runtime status and log UI.'
          printf '%s\n' '#!/bin/sh' '[ "${IPKG_NO_SCRIPT}" = "1" ] && exit 0' '[ -s ${IPKG_INSTROOT}/lib/functions.sh ] || exit 0' '. ${IPKG_INSTROOT}/lib/functions.sh' 'default_postinst $0 $@' '[ -n "${IPKG_INSTROOT}" ] || rm -f /tmp/luci-indexcache' '[ -n "${IPKG_INSTROOT}" ] || rm -rf /tmp/luci-modulecache/' > "$UI/CONTROL/postinst"
          chmod 0755 "$UI/CONTROL/postinst"
          write_prerm "$UI"
          write_postrm "$UI"

          sdk/scripts/ipkg-build "$CORE" "$GITHUB_WORKSPACE/dist"
          sdk/scripts/ipkg-build "$API" "$GITHUB_WORKSPACE/dist"
          sdk/scripts/ipkg-build "$UI" "$GITHUB_WORKSPACE/dist"
          ls -lh dist
          test "$(find dist -maxdepth 1 -name '*.ipk' | wc -l)" -eq 3

      - name: Verify package semantics
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          set -euo pipefail
          VERIFY="$RUNNER_TEMP/ipk-verify"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"
          extract_ipk() {
            local ipk="$1" out="$2"
            mkdir -p "$out"
            if tar -tzf "$ipk" >/dev/null 2>&1; then
              tar -xzf "$ipk" -C "$out"
            else
              tar -xf "$ipk" -C "$out"
            fi
            local ctl dat
            ctl="$(find "$out" -maxdepth 1 -type f -name 'control.tar*' | head -1)"
            dat="$(find "$out" -maxdepth 1 -type f -name 'data.tar*' | head -1)"
            test -n "$ctl"
            test -n "$dat"
            mkdir -p "$out/control" "$out/data"
            tar -xf "$ctl" -C "$out/control"
            tar -xf "$dat" -C "$out/data"
          }
          CORE_IPK="$(find dist -maxdepth 1 -name 'gk-bacnet-mqtt_*.ipk' | head -1)"
          API_IPK="$(find dist -maxdepth 1 -name 'vuci-app-gk-bacnet-mqtt-api_*.ipk' | head -1)"
          UI_IPK="$(find dist -maxdepth 1 -name 'vuci-app-gk-bacnet-mqtt-ui_*.ipk' | head -1)"
          extract_ipk "$CORE_IPK" "$VERIFY/core"
          extract_ipk "$API_IPK" "$VERIFY/api"
          extract_ipk "$UI_IPK" "$VERIFY/ui"
          grep -q '^Depends: libc, lib-bacnet, libmosquitto-ssl, libatomic1$' "$VERIFY/core/control/control"
          grep -q "^Firmware: $FIRMWARE$" "$VERIFY/core/control/control"
          test -x "$VERIFY/core/control/postinst"
          test -x "$VERIFY/core/control/prerm"
          CORE_BIN="$VERIFY/core/data/usr/sbin/gk-bacnet-mqtt"
          test -s "$CORE_BIN"
          file "$CORE_BIN" | grep -q 'ELF 32-bit'
          readelf -h "$CORE_BIN" | grep -q 'Machine:.*MIPS'
          grep -q '^Depends: libc, gk-bacnet-mqtt, api-core$' "$VERIFY/api/control/control"
          test -x "$VERIFY/api/control/postinst"
          test -x "$VERIFY/api/control/prerm"
          test -x "$VERIFY/api/control/postrm"
          grep -q '^Depends: libc, gk-bacnet-mqtt, vuci-app-gk-bacnet-mqtt-api$' "$VERIFY/ui/control/control"
          test -x "$VERIFY/ui/control/postinst"
          test -x "$VERIFY/ui/control/prerm"
          test -x "$VERIFY/ui/control/postrm"

      - uses: actions/upload-artifact@v4
        with:
          name: gk-bacnet-mqtt-fast-${{ matrix.target }}-${{ github.sha }}
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 14

name: 3 - Fast Build GK BACnet MQTT IPK - RUT2M

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fast RUT2M single IPK
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      VUCI_CACHE_KEY: gk-sdk-vuci-RUT2M-00.07.24.2-v1

    steps:
      - uses: actions/checkout@v4

      - name: Restore exact prepared VuCI SDK cache
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: sdk
          key: ${{ env.VUCI_CACHE_KEY }}-${{ runner.os }}

      - name: Require prepared SDK
        run: |
          set -euo pipefail
          test "${{ steps.sdk-cache.outputs.cache-hit }}" = "true"
          test -f sdk/include/toplevel.mk
          test -f sdk/ipk_packages.json
          test -f sdk/tmp/.packageinfo
          test -f sdk/.config
          test -d sdk/package/custom/gk-bacnet-mqtt
          test -d sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-ui
          test -f "$(find sdk/package/teltonika/libs/lib-bacnet -type f -name 'libbacnet.so' | head -1)"
          VUCI_CORE="$(find sdk/build_dir -type d -name 'vuci-ui-core-*' | head -1)"
          test -n "$VUCI_CORE"
          test -f "$VUCI_CORE/.built"

      - name: Get BACnet headers
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/bacnet-stack/bacnet-stack/archive/refs/tags/bacnet-stack-1.3.8.tar.gz -o "$RUNNER_TEMP/bacnet.tar.gz"
          mkdir -p "$RUNNER_TEMP/bacnet-stack"
          tar -xzf "$RUNNER_TEMP/bacnet.tar.gz" -C "$RUNNER_TEMP/bacnet-stack" --strip-components=1

      - name: Cross compile gateway
        run: |
          set -euo pipefail
          SDK="$GITHUB_WORKSPACE/sdk"
          export STAGING_DIR="$SDK/staging_dir"
          BAC="$RUNNER_TEMP/bacnet-stack"
          TOOLCHAIN_DIR="$(find "$SDK/staging_dir" -maxdepth 1 -type d -name 'toolchain-*' | head -1)"
          SYSROOT="$(find "$SDK/staging_dir" -maxdepth 1 -type d -name 'target-*' | head -1)"
          CC="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*-gcc' | head -1)"
          STRIP="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*-strip' | head -1)"
          MOSQDIR="$(find "$SDK/build_dir" -type d -path '*/mosquitto-ssl/mosquitto-2.0.21' | head -1)"
          LIBBACNET="$(find "$SDK/package/teltonika/libs/lib-bacnet" -type f -name 'libbacnet.so' | head -1)"
          test -x "$CC"; test -x "$STRIP"; test -f "$LIBBACNET"
          "$CC" -Os --sysroot="$SYSROOT" \
            -I"$GITHUB_WORKSPACE/src" -I"$BAC/src" -I"$BAC/ports/linux" -I"$BAC/ports/posix" -I"$MOSQDIR/include" \
            "$GITHUB_WORKSPACE/src/main.c" "$GITHUB_WORKSPACE/src/util.c" \
            "$GITHUB_WORKSPACE/src/device_table.c" "$GITHUB_WORKSPACE/src/mqtt_client.c" \
            "$GITHUB_WORKSPACE/src/bacnet_client.c" "$GITHUB_WORKSPACE/src/status.c" \
            "$LIBBACNET" "$MOSQDIR/lib/libmosquitto.so.1" \
            -L"$SDK/staging_dir/usr/lib" -Wl,-rpath,/usr/lib -Wl,-rpath-link,"$SDK/staging_dir/usr/lib" \
            -pthread -lrt -lm -latomic -o "$GITHUB_WORKSPACE/gk-bacnet-mqtt"
          "$STRIP" "$GITHUB_WORKSPACE/gk-bacnet-mqtt"
          readelf -d "$GITHUB_WORKSPACE/gk-bacnet-mqtt" | grep -qi libbacnet

      - name: Update GK build sources
        run: |
          set -euo pipefail
          cp package/build-shims/lib-bacnet/Makefile sdk/package/custom/lib-bacnet/Makefile
          cp package/gk-bacnet-mqtt/Makefile sdk/package/custom/gk-bacnet-mqtt/Makefile
          rsync -a --delete package/gk-bacnet-mqtt/files/ sdk/package/custom/gk-bacnet-mqtt/files/
          cp gk-bacnet-mqtt sdk/package/custom/gk-bacnet-mqtt/files/gk-bacnet-mqtt

          # UI remains a build-only source package. It is never published/installed.
          rsync -a --delete package/vuci-app-gk-bacnet-mqtt-ui/ sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-ui/

          rm -rf sdk/package/custom/gk-bacnet-mqtt/runtime
          mkdir -p sdk/package/custom/gk-bacnet-mqtt/runtime/api/services
          mkdir -p sdk/package/custom/gk-bacnet-mqtt/runtime/vuci/path.d
          mkdir -p sdk/package/custom/gk-bacnet-mqtt/runtime/vuci/menu.d
          mkdir -p sdk/package/custom/gk-bacnet-mqtt/runtime/rpcd/acl.d
          cp package/vuci-app-gk-bacnet-mqtt-api/files/usr/lib/lua/api/services/*.lua sdk/package/custom/gk-bacnet-mqtt/runtime/api/services/
          cp package/vuci-app-gk-bacnet-mqtt-api/files/usr/share/vuci/path.d/*.json sdk/package/custom/gk-bacnet-mqtt/runtime/vuci/path.d/
          cp package/vuci-app-gk-bacnet-mqtt-api/files/usr/share/rpcd/acl.d/*.json sdk/package/custom/gk-bacnet-mqtt/runtime/rpcd/acl.d/
          cp package/vuci-app-gk-bacnet-mqtt-ui/files/usr/share/vuci/menu.d/*.json sdk/package/custom/gk-bacnet-mqtt/runtime/vuci/menu.d/

          find sdk/bin/packages -type f \( -name 'gk-bacnet-mqtt_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-*.ipk' -o -name 'gk_bacnet_mqtt.tar.gz' \) -delete 2>/dev/null || true

      - name: Pin cached VuCI core
        run: |
          set -euo pipefail
          VUCI_CORE="$(find sdk/build_dir -type d -name 'vuci-ui-core-*' | head -1)"
          test -f "$VUCI_CORE/.built"
          touch "$VUCI_CORE/.built"
          CORE_INSTALL_STAMP="$(find sdk/staging_dir -type f -name '.vuci-ui-core_installed' | head -1 || true)"
          if [ -n "$CORE_INSTALL_STAMP" ]; then touch "$CORE_INSTALL_STAMP"; fi
          rm -f sdk/tmp/.pkg-rebuilt

      - name: Build UI assets only
        working-directory: sdk
        run: |
          set -euo pipefail
          make package/vuci-app-gk-bacnet-mqtt-ui/compile -j2 V=s
          if test -f tmp/.pkg-rebuilt && grep -qx 'vuci-ui-core' tmp/.pkg-rebuilt; then
            echo 'ERROR: Fast Build unexpectedly rebuilt vuci-ui-core.' >&2
            exit 1
          fi

          UI_IPK="$(find bin/packages -type f -name 'vuci-app-gk-bacnet-mqtt-ui_*.ipk' | head -1)"
          test -f "$UI_IPK"
          TMP="$(mktemp -d)"
          if gzip -t "$UI_IPK" 2>/dev/null; then
            tar -xzf "$UI_IPK" -C "$TMP"
          else
            (cd "$TMP" && ar x "$(realpath "$UI_IPK")")
          fi
          mkdir -p "$TMP/data"
          tar -xzf "$TMP/data.tar.gz" -C "$TMP/data"
          test -d "$TMP/data/www"
          rm -rf package/custom/gk-bacnet-mqtt/runtime/www
          cp -a "$TMP/data/www" package/custom/gk-bacnet-mqtt/runtime/www
          rm -rf "$TMP"

          # Build-only UI IPK must not survive to artifacts/PM input.
          find bin/packages -type f -name 'vuci-app-gk-bacnet-mqtt-ui_*.ipk' -delete

      - name: Build single GK IPK
        working-directory: sdk
        run: |
          set -euo pipefail
          make package/gk-bacnet-mqtt/compile -j2 V=s
          CORE_IPK="$(find bin/packages -type f -name 'gk-bacnet-mqtt_*.ipk' | head -1)"
          test -f "$CORE_IPK"
          test -z "$(find bin/packages -type f -name 'vuci-app-gk-bacnet-mqtt-*.ipk' -print -quit)"

      - name: Build single-IPK Package Manager bundle
        working-directory: sdk
        run: |
          set -euo pipefail
          cp ipk_packages.json "$RUNNER_TEMP/ipk_packages.full.json"
          trap 'cp "$RUNNER_TEMP/ipk_packages.full.json" ipk_packages.json' EXIT
          cat > ipk_packages.json <<'JSON'
          {
            "gk-bacnet-mqtt": {
              "name": "gk_bacnet_mqtt"
            }
          }
          JSON
          USIGN="staging_dir/host/bin/usign"
          test -x "$USIGN"
          rm -f key-build key-build.pub
          "$USIGN" -G -p key-build.pub -s key-build
          make -j1 pm V=s
          PM_BUNDLE="$(find bin/packages -type f -path '*/zipped_packages/gk_bacnet_mqtt.tar.gz' | head -1)"
          test -f "$PM_BUNDLE"
          LIST="$(tar -tzf "$PM_BUNDLE")"
          printf '%s\n' "$LIST"
          test "$(printf '%s\n' "$LIST" | grep -c 'gk-bacnet-mqtt_.*\.ipk')" -eq 1
          ! printf '%s\n' "$LIST" | grep -q 'vuci-app-gk-bacnet-mqtt'
          cp "$RUNNER_TEMP/ipk_packages.full.json" ipk_packages.json
          trap - EXIT

      - name: Collect and verify single package
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          CORE_IPK="$(find sdk/bin/packages -type f -name 'gk-bacnet-mqtt_*.ipk' | head -1)"
          PM_BUNDLE="$(find sdk/bin/packages -type f -path '*/zipped_packages/gk_bacnet_mqtt.tar.gz' | head -1)"
          cp "$CORE_IPK" dist/
          cp "$PM_BUNDLE" dist/
          test "$(find dist -maxdepth 1 -name '*.ipk' | wc -l)" -eq 1

          TMP="$(mktemp -d)"
          IPK="$(find dist -maxdepth 1 -name 'gk-bacnet-mqtt_*.ipk' | head -1)"
          if gzip -t "$IPK" 2>/dev/null; then tar -xzf "$IPK" -C "$TMP"; else (cd "$TMP" && ar x "$(realpath "$IPK")"); fi
          mkdir -p "$TMP/data"
          tar -xzf "$TMP/data.tar.gz" -C "$TMP/data"
          test -x "$TMP/data/usr/sbin/gk-bacnet-mqtt"
          test -f "$TMP/data/etc/config/gk_bacnet_mqtt"
          test -x "$TMP/data/etc/init.d/gk-bacnet-mqtt"
          test -f "$TMP/data/usr/lib/lua/api/services/gk_bacnet_mqtt_config.lua"
          test -f "$TMP/data/usr/lib/lua/api/services/gk_bacnet_mqtt_status.lua"
          test -f "$TMP/data/usr/share/vuci/path.d/gk-bacnet-mqtt.json"
          test -f "$TMP/data/usr/share/rpcd/acl.d/gk-bacnet-mqtt.json"
          test -f "$TMP/data/usr/share/vuci/menu.d/gk-bacnet-mqtt.json"
          test -d "$TMP/data/www/views"
          test -n "$(find "$TMP/data/www/views" -type f | head -1)"
          rm -rf "$TMP"

          # Normalize Teltonika raw IPK for direct opkg installation.
          if ! gzip -t "$IPK" 2>/dev/null; then
            TMP="$(mktemp -d)"; ABS="$(realpath "$IPK")"
            (cd "$TMP" && ar x "$ABS" && printf '2.0\n' > debian-binary && members=(./debian-binary ./data.tar.gz ./control.tar.gz) && if test -f control+data.sig; then members+=(./control+data.sig); fi && tar -czf "$ABS.new" "${members[@]}")
            mv "$ABS.new" "$ABS"; rm -rf "$TMP"
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: gk-bacnet-mqtt-RUT2M-single-${{ github.sha }}
          path: |
            dist/gk-bacnet-mqtt_*.ipk
            dist/gk_bacnet_mqtt.tar.gz
          if-no-files-found: error
          retention-days: 30

name: 3 - Fast Build GK BACnet MQTT IPK - RUT2M

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fast RUT2M single VuCI package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      VUCI_CACHE_KEY: gk-sdk-vuci-RUT2M-00.07.24.2-v1
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact prepared VuCI SDK cache
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: sdk
          key: ${{ env.VUCI_CACHE_KEY }}-${{ runner.os }}
      - name: Require prepared SDK
        run: |
          set -euo pipefail
          test "${{ steps.sdk-cache.outputs.cache-hit }}" = "true"
          test -f sdk/include/toplevel.mk
          test -f sdk/tmp/.packageinfo
          test -f sdk/.config
          test -d sdk/package/custom/gk-bacnet-mqtt
          test -d sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-ui
          test -f "$(find sdk/package/teltonika/libs/lib-bacnet -type f -name 'libbacnet.so' | head -1)"
      - name: Get BACnet headers
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/bacnet-stack/bacnet-stack/archive/refs/tags/bacnet-stack-1.3.8.tar.gz -o "$RUNNER_TEMP/bacnet.tar.gz"
          mkdir -p "$RUNNER_TEMP/bacnet-stack"
          tar -xzf "$RUNNER_TEMP/bacnet.tar.gz" -C "$RUNNER_TEMP/bacnet-stack" --strip-components=1
      - name: Cross compile gateway
        run: |
          set -euo pipefail
          SDK="$GITHUB_WORKSPACE/sdk"; export STAGING_DIR="$SDK/staging_dir"; BAC="$RUNNER_TEMP/bacnet-stack"
          TOOLCHAIN_DIR="$(find "$SDK/staging_dir" -maxdepth 1 -type d -name 'toolchain-*' | head -1)"
          SYSROOT="$(find "$SDK/staging_dir" -maxdepth 1 -type d -name 'target-*' | head -1)"
          CC="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*-gcc' | head -1)"
          STRIP="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*-strip' | head -1)"
          MOSQDIR="$(find "$SDK/build_dir" -type d -path '*/mosquitto-ssl/mosquitto-2.0.21' | head -1)"
          LIBBACNET="$(find "$SDK/package/teltonika/libs/lib-bacnet" -type f -name 'libbacnet.so' | head -1)"
          "$CC" -Os --sysroot="$SYSROOT" -I"$GITHUB_WORKSPACE/src" -I"$BAC/src" -I"$BAC/ports/linux" -I"$BAC/ports/posix" -I"$MOSQDIR/include" "$GITHUB_WORKSPACE/src/main.c" "$GITHUB_WORKSPACE/src/util.c" "$GITHUB_WORKSPACE/src/device_table.c" "$GITHUB_WORKSPACE/src/mqtt_client.c" "$GITHUB_WORKSPACE/src/bacnet_client.c" "$GITHUB_WORKSPACE/src/status.c" "$LIBBACNET" "$MOSQDIR/lib/libmosquitto.so.1" -L"$SDK/staging_dir/usr/lib" -Wl,-rpath,/usr/lib -Wl,-rpath-link,"$SDK/staging_dir/usr/lib" -pthread -lrt -lm -latomic -o "$GITHUB_WORKSPACE/gk-bacnet-mqtt"
          "$STRIP" "$GITHUB_WORKSPACE/gk-bacnet-mqtt"
          readelf -d "$GITHUB_WORKSPACE/gk-bacnet-mqtt" | grep -qi libbacnet
      - name: Inject runtime without changing cached package graph
        run: |
          set -euo pipefail
          CORE=sdk/package/custom/gk-bacnet-mqtt; UI=sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-ui
          rsync -a --delete --exclude Makefile package/gk-bacnet-mqtt/files/ "$CORE/files/"
          cp gk-bacnet-mqtt "$CORE/files/gk-bacnet-mqtt"
          rsync -a --delete --exclude Makefile package/vuci-app-gk-bacnet-mqtt-ui/ "$UI/"
          mkdir -p "$UI/files/usr/sbin" "$UI/files/etc/config" "$UI/files/etc/init.d" "$UI/files/usr/lib/lua/api/services" "$UI/files/usr/share/vuci/path.d" "$UI/files/usr/share/rpcd/acl.d"
          cp gk-bacnet-mqtt "$UI/files/usr/sbin/gk-bacnet-mqtt"; chmod 0755 "$UI/files/usr/sbin/gk-bacnet-mqtt"
          cp package/gk-bacnet-mqtt/files/gk-bacnet-mqtt.config "$UI/files/etc/config/gk_bacnet_mqtt"
          cp package/gk-bacnet-mqtt/files/gk-bacnet-mqtt.init "$UI/files/etc/init.d/gk-bacnet-mqtt"; chmod 0755 "$UI/files/etc/init.d/gk-bacnet-mqtt"
          cp package/vuci-app-gk-bacnet-mqtt-api/files/usr/lib/lua/api/services/*.lua "$UI/files/usr/lib/lua/api/services/"
          cp package/vuci-app-gk-bacnet-mqtt-api/files/usr/share/vuci/path.d/*.json "$UI/files/usr/share/vuci/path.d/"
          cp package/vuci-app-gk-bacnet-mqtt-api/files/usr/share/rpcd/acl.d/*.json "$UI/files/usr/share/rpcd/acl.d/"
          find sdk/bin/packages -type f \( -name 'gk-bacnet-mqtt_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-api_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-ui_*.ipk' -o -name 'gk_bacnet_mqtt.tar.gz' \) -delete 2>/dev/null || true
      - name: Build UI with cached target graph
        working-directory: sdk
        run: |
          set -euo pipefail
          make package/vuci-app-gk-bacnet-mqtt-ui/compile -j2 V=s
          test -f "$(find bin/packages -type f -name 'vuci-app-gk-bacnet-mqtt-ui_*.ipk' | head -1)"
          test -f "$(find bin/packages -type f -name 'lib-bacnet_*.ipk' | head -1)"
      - name: Convert built UI IPK to standalone runtime IPK
        working-directory: sdk
        run: |
          set -euo pipefail
          UI_IPK="$(find bin/packages -type f -name 'vuci-app-gk-bacnet-mqtt-ui_*.ipk' | head -1)"
          test -f "$UI_IPK"
          TMP="$(mktemp -d)"
          if gzip -t "$UI_IPK" 2>/dev/null; then
            tar -xzf "$UI_IPK" -C "$TMP"
            FORMAT=gzip
          else
            (cd "$TMP" && ar x "$(realpath "$UI_IPK")")
            FORMAT=ar
          fi
          mkdir -p "$TMP/control" "$TMP/data"
          tar -xzf "$TMP/control.tar.gz" -C "$TMP/control"
          tar -xzf "$TMP/data.tar.gz" -C "$TMP/data"
          python3 - "$TMP/control/control" <<'PY'
          import sys
          p=sys.argv[1]; lines=open(p).read().splitlines(); out=[]
          for line in lines:
              if line.startswith('Version:'): line='Version: 1.0.0-10'
              elif line.startswith('Depends:'): line='Depends: libc, libmosquitto-ssl, libatomic1, lib-bacnet, api-core, vuci-ui-core'
              elif line.startswith('Description:'): line='Description:  GK BACnet to MQTT gateway. Single RutOS package containing daemon, UCI config, API and VuCI UI.'
              out.append(line)
          open(p,'w').write('\n'.join(out)+'\n')
          PY
          rm -f "$TMP/control.tar.gz"
          tar -czf "$TMP/control.tar.gz" -C "$TMP/control" .
          OUTDIR="$(cd "$(dirname "$UI_IPK")" && pwd)"
          NEW_IPK="$OUTDIR/vuci-app-gk-bacnet-mqtt-ui_1.0.0-10_mipsel_24kc.ipk"
          rm -f "$UI_IPK" "$NEW_IPK"
          if [ "$FORMAT" = gzip ]; then
            tar -czf "$NEW_IPK" -C "$TMP" ./debian-binary ./control.tar.gz ./data.tar.gz
          else
            (cd "$TMP" && ar r "$NEW_IPK" debian-binary control.tar.gz data.tar.gz)
          fi
          test -f "$NEW_IPK"
          cat "$TMP/control/control"
          grep -q '^Version: 1.0.0-10$' "$TMP/control/control"
          grep -q '^Depends: libc, libmosquitto-ssl, libatomic1, lib-bacnet, api-core, vuci-ui-core$' "$TMP/control/control"
          test -x "$TMP/data/usr/sbin/gk-bacnet-mqtt"; test -f "$TMP/data/etc/config/gk_bacnet_mqtt"; test -x "$TMP/data/etc/init.d/gk-bacnet-mqtt"
          test -f "$TMP/data/usr/lib/lua/api/services/gk_bacnet_mqtt_config.lua"; test -f "$TMP/data/usr/lib/lua/api/services/gk_bacnet_mqtt_status.lua"
          test -f "$TMP/data/usr/share/vuci/path.d/gk-bacnet-mqtt.json"; test -f "$TMP/data/usr/share/rpcd/acl.d/gk-bacnet-mqtt.json"; test -f "$TMP/data/usr/share/vuci/menu.d/gk-bacnet-mqtt.json"
          test -n "$(find "$TMP/data/www/views" -type f | head -1)"
          rm -rf "$TMP"
          find bin/packages -type f \( -name 'gk-bacnet-mqtt_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-api_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-ui_1.0.0-4_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-ui_1.0.0-6_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-ui_1.0.0-7_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-ui_1.0.0-8_*.ipk' -o -name 'vuci-app-gk-bacnet-mqtt-ui_1.0.0-9_*.ipk' \) -delete
      - name: Build Package Manager bundle with BACnet runtime dependency
        working-directory: sdk
        run: |
          set -euo pipefail
          cp ipk_packages.json "$RUNNER_TEMP/ipk_packages.full.json"; trap 'cp "$RUNNER_TEMP/ipk_packages.full.json" ipk_packages.json' EXIT
          printf '%s\n' '{' '  "vuci-app-gk-bacnet-mqtt-ui": {' '    "name": "gk_bacnet_mqtt",' '    "base_dep": "lib-bacnet"' '  }' '}' > ipk_packages.json
          rm -f key-build key-build.pub; staging_dir/host/bin/usign -G -p key-build.pub -s key-build
          make -j1 pm V=s
          PM_BUNDLE="$(find bin/packages -type f -path '*/zipped_packages/gk_bacnet_mqtt.tar.gz' | head -1)"; test -f "$PM_BUNDLE"
          LIST="$(tar -tzf "$PM_BUNDLE")"; printf '%s\n' "$LIST"
          test "$(printf '%s\n' "$LIST" | grep -c 'vuci-app-gk-bacnet-mqtt-ui_.*\.ipk$')" -eq 1
          printf '%s\n' "$LIST" | grep -q 'vuci-app-gk-bacnet-mqtt-ui_1.0.0-10_mipsel_24kc.ipk$'
          test "$(printf '%s\n' "$LIST" | grep -c 'lib-bacnet_.*\.ipk$')" -eq 1
          ! printf '%s\n' "$LIST" | grep -q 'gk-bacnet-mqtt_.*\.ipk$'
          ! printf '%s\n' "$LIST" | grep -q 'vuci-app-gk-bacnet-mqtt-api_.*\.ipk$'
          printf '%s\n' "$LIST" | grep -q '^main$'; printf '%s\n' "$LIST" | grep -q '^main.sig$'
          cp "$PM_BUNDLE" "$RUNNER_TEMP/gk_bacnet_mqtt.tar.gz"
      - name: Return only the RutOS Package Manager file
        run: |
          set -euo pipefail
          rm -rf dist; mkdir -p dist; cp "$RUNNER_TEMP/gk_bacnet_mqtt.tar.gz" dist/gk_bacnet_mqtt.tar.gz; tar -tzf dist/gk_bacnet_mqtt.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gk-bacnet-mqtt-rut2m
          path: dist/gk_bacnet_mqtt.tar.gz
          if-no-files-found: error

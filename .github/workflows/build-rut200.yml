name: Build RUT200 IPK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'package/**'
      - '.github/workflows/build-rut200.yml'

permissions:
  contents: read

env:
  SDK_ARCHIVE: RUT2M_R_GPL_00.07.24.2.tar.gz
  SDK_MD5: d94ad61ba377433ba96432de980b940a

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils binutils-gold bison build-essential bzip2 ca-certificates curl cmake default-jdk device-tree-compiler devscripts ecj file flex fuse g++ gawk gcc gcovr gengetopt gettext git gnupg groff gperf help2man java-wrappers jq libc6-dev libffi-dev libexpat-dev libncurses5-dev libpcre3-dev libsqlite3-dev libssl-dev libxml-parser-perl lz4 liblz4-dev libzstd-dev make ocaml ocaml-findlib ocaml-nox patch pkg-config psmisc python-is-python3 python3.11 python3.11-dev python3-setuptools python3-yaml rsync ruby sharutils subversion swig u-boot-tools unzip uuid-dev vim-common wget zip zlib1g-dev gcc-multilib g++-multilib
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Download RutOS SDK
        env:
          TELTONIKA_SDK_URL: ${{ secrets.TELTONIKA_SDK_URL }}
        run: |
          set -euo pipefail
          test -n "${TELTONIKA_SDK_URL:-}" || { echo 'Missing repository secret TELTONIKA_SDK_URL'; exit 1; }
          curl -fL --retry 4 "$TELTONIKA_SDK_URL" -o "$RUNNER_TEMP/$SDK_ARCHIVE"
          echo "$SDK_MD5  $RUNNER_TEMP/$SDK_ARCHIVE" | md5sum -c -
          mkdir "$GITHUB_WORKSPACE/sdk"
          tar -xzf "$RUNNER_TEMP/$SDK_ARCHIVE" -C "$GITHUB_WORKSPACE/sdk" --strip-components=1

      - name: Update feeds
        working-directory: sdk
        run: ./scripts/feeds update -a

      - name: Prepare toolchain and Mosquitto
        working-directory: sdk
        run: |
          make tools/install -j2
          make toolchain/install -j2
          make package/mosquitto/compile -j2

      - name: Get BACnet Stack 1.3.8 headers
        run: |
          curl -fL --retry 4 https://github.com/bacnet-stack/bacnet-stack/archive/refs/tags/bacnet-stack-1.3.8.tar.gz -o "$RUNNER_TEMP/bacnet.tar.gz"
          mkdir "$RUNNER_TEMP/bacnet-stack"
          tar -xzf "$RUNNER_TEMP/bacnet.tar.gz" -C "$RUNNER_TEMP/bacnet-stack" --strip-components=1

      - name: Assemble source
        run: |
          cat src/parts/part00.cfrag > src/rut200_bacnet_mqtt_gateway.c
          tail -n +2 src/parts/part01.cfrag >> src/rut200_bacnet_mqtt_gateway.c
          cat src/parts/part02.cfrag >> src/rut200_bacnet_mqtt_gateway.c

      - name: Cross compile gateway
        run: |
          set -euo pipefail
          SDK="$GITHUB_WORKSPACE/sdk"
          export STAGING_DIR="$SDK/staging_dir"
          BAC="$RUNNER_TEMP/bacnet-stack"
          MOSQDIR="$(find "$SDK/build_dir/target-mipsel_24kc_musl" -type d -path '*/mosquitto-ssl/mosquitto-2.0.21' | head -1)"
          CC="$SDK/staging_dir/toolchain-mipsel_24kc_gcc-8.4.0_musl/bin/mipsel-openwrt-linux-musl-gcc"
          STRIP="$SDK/staging_dir/toolchain-mipsel_24kc_gcc-8.4.0_musl/bin/mipsel-openwrt-linux-musl-strip"
          SYSROOT="$SDK/staging_dir/target-mipsel_24kc_musl"
          test -x "$CC"
          test -n "$MOSQDIR"
          "$CC" -Os -march=24kc -msoft-float --sysroot="$SYSROOT" \
            -I"$BAC/src" -I"$MOSQDIR/include" \
            "$GITHUB_WORKSPACE/src/rut200_bacnet_mqtt_gateway.c" \
            "$SDK/package/teltonika/libs/lib-bacnet/ipkg-install/usr/lib/libbacnet.so" \
            "$MOSQDIR/lib/libmosquitto.so.1" \
            -L"$SDK/staging_dir/usr/lib" \
            -Wl,-rpath,/usr/lib -Wl,-rpath-link,"$SDK/staging_dir/usr/lib" \
            -latomic -o "$GITHUB_WORKSPACE/rut200-bacnet-mqtt"
          "$STRIP" "$GITHUB_WORKSPACE/rut200-bacnet-mqtt"
          file "$GITHUB_WORKSPACE/rut200-bacnet-mqtt"

      - name: Install custom package definitions
        run: |
          mkdir -p sdk/package/custom/rut200-bacnet-mqtt/files sdk/package/custom/libbacnet-teltonika
          cp package/rut200-bacnet-mqtt/Makefile sdk/package/custom/rut200-bacnet-mqtt/Makefile
          cp package/rut200-bacnet-mqtt/files/* sdk/package/custom/rut200-bacnet-mqtt/files/
          cp rut200-bacnet-mqtt sdk/package/custom/rut200-bacnet-mqtt/files/rut200-bacnet-mqtt
          cp package/libbacnet-teltonika/Makefile sdk/package/custom/libbacnet-teltonika/Makefile

      - name: Enable and build IPKs
        working-directory: sdk
        run: |
          rm -rf tmp
          make defconfig
          printf '%s\n' 'CONFIG_PACKAGE_libbacnet-teltonika=m' 'CONFIG_PACKAGE_rut200-bacnet-mqtt=m' >> .config
          make defconfig
          make package/custom/libbacnet-teltonika/compile -j1 V=s
          make package/custom/rut200-bacnet-mqtt/compile -j1 V=s

      - name: Collect IPKs
        run: |
          mkdir dist
          find sdk/bin/packages/mipsel_24kc -type f \( -iname '*libbacnet*teltonika*.ipk' -o -iname '*rut200*bacnet*mqtt*.ipk' \) -exec cp -v {} dist/ \;
          ls -lh dist
          test "$(find dist -name '*.ipk' | wc -l)" -ge 2

      - uses: actions/upload-artifact@v4
        with:
          name: rut200-ipk-${{ github.sha }}
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 30
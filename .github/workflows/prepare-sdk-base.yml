name: 1 - Prepare RUT2M SDK Base Cache

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare-base:
    name: Build SDK base
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      SDK_URL: https://firmware.teltonika-networks.com/7.24.6/RUT2M/RUT2M_R_GPL_00.07.24.6.tar.gz
      SDK_ARCHIVE: RUT2M_R_GPL_00.07.24.6.tar.gz
      BASE_CACHE_KEY: gk-sdk-base-RUT2M-00.07.24.6-v2

    steps:
      - uses: actions/checkout@v4
      - name: Restore exact firmware SDK base
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: sdk
          key: ${{ env.BASE_CACHE_KEY }}-${{ runner.os }}

      - name: Install SDK prerequisites
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Avoid the Azure mirror that stalled the previous cold build.
          # Change Ubuntu sources only; retain suites and signature verification.
          sudo python3 - <<'PY'
          from pathlib import Path
          sources = [Path('/etc/apt/sources.list')]
          sources += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          sources += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          for path in sources:
              if not path.is_file():
                  continue
              old = path.read_text()
              new = old.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
              new = new.replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
              if new != old:
                  path.write_text(new)
                  print('Switched Ubuntu mirror in', path)
          PY
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTIONS=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          timeout --kill-after=15s 2m sudo -E apt-get "${APT_OPTIONS[@]}" update
          # Preserve the SDK dependency list. Bound total download time, including
          # slow transfers that never reach apt's connection timeout.
          PACKAGES=(
            binutils binutils-gold bison build-essential bzip2 ca-certificates curl cmake
            default-jdk device-tree-compiler devscripts ecj file flex fuse g++ gawk gcc gcovr
            gengetopt gettext git gnupg groff gperf help2man java-wrappers jq libc6-dev
            libffi-dev libexpat-dev libncurses5-dev libpcre3-dev libsqlite3-dev libssl-dev
            libxml-parser-perl lz4 liblz4-dev libzstd-dev make ocaml ocaml-findlib ocaml-nox
            patch pkg-config psmisc python-is-python3 python3.11 python3.11-dev python3-setuptools
            python3-yaml rsync ruby sharutils subversion swig u-boot-tools unzip uuid-dev
            vim-common wget zip zlib1g-dev gcc-multilib g++-multilib
          )
          if timeout --kill-after=15s 8m sudo -E apt-get "${APT_OPTIONS[@]}" install --download-only -y "${PACKAGES[@]}"; then
            echo "SDK dependency download completed within eight minutes"
          else
            rc=$?
            echo "::error::SDK dependency download failed or exceeded eight minutes (exit $rc). See the package URLs above; compilation has not started."
            exit "$rc"
          fi
          # Install exactly the packages downloaded above without further network
          # transfers. Keep the package selection in one place.
          timeout --kill-after=15s 4m sudo -E apt-get "${APT_OPTIONS[@]}" install --no-download -y "${PACKAGES[@]}"

      - name: Download exact RUT2M GPL SDK
        if: steps.sdk-cache.outputs.cache-matched-key == ''
        run: |
          set -euo pipefail
          rm -rf sdk
          curl -fL --retry 5 --retry-delay 5 "$SDK_URL" -o "$RUNNER_TEMP/$SDK_ARCHIVE"
          mkdir sdk
          tar -xzf "$RUNNER_TEMP/$SDK_ARCHIVE" -C sdk --strip-components=1
          test -f sdk/include/toplevel.mk
          test -x sdk/scripts/feeds

      - name: Refresh feeds metadata
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: sdk
        run: |
          set -euo pipefail
          if [ -z "${{ steps.sdk-cache.outputs.cache-matched-key }}" ]; then
            ./scripts/feeds update -a
          fi
          for sym in CONFIG_PACKAGE_libcurl CONFIG_PACKAGE_libjson-c CONFIG_PACKAGE_libuci CONFIG_PACKAGE_ca-bundle CONFIG_LIBCURL_OPENSSL CONFIG_LIBCURL_THREADED_RESOLVER; do
            sed -i "/^${sym}=/d;/^# ${sym} is not set$/d" .config
            echo "${sym}=y" >> .config
          done
          make defconfig
          # Resolve binary package names to this SDK's actual source targets.
          : > .gk-library-targets
          for pkg in libcurl libjson-c libuci ca-bundle; do
            source=$(awk -v pkg="$pkg" '$1 == "Source-Makefile:" { source=$2 } $1 == "Package:" && $2 == pkg { print source; exit }' tmp/.packageinfo)
            test -n "$source"
            test -f "$source"
            echo "${source%/Makefile}/compile" >> .gk-library-targets
          done
          cat .gk-library-targets

      - name: Build expensive base prerequisites
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: sdk
        run: |
          set -euo pipefail
          if [ -z "${{ steps.sdk-cache.outputs.cache-matched-key }}" ]; then
            make tools/install -j2
            make toolchain/install -j2
          fi
          make package/mosquitto/compile -j2
          while IFS= read -r target; do
            make "$target" -j2 V=s
          done < .gk-library-targets

      - name: Verify base before saving
        run: |
          set -euo pipefail
          test -f sdk/include/toplevel.mk
          test -f sdk/.config
          test -f sdk/tmp/.packageinfo
          TOOLCHAIN_DIR="$(find sdk/staging_dir -maxdepth 1 -type d -name 'toolchain-*' | head -1)"
          test -n "$TOOLCHAIN_DIR"
          CC="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*-gcc' | head -1)"
          test -x "$CC"
          test -n "$(find sdk/build_dir -type f -path '*/mosquitto-ssl/mosquitto-*/lib/libmosquitto.so.1' | head -1)"
          echo "BASE READY: ${BASE_CACHE_KEY}-${{ runner.os }}"

      - name: Save SDK base cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sdk
          key: ${{ env.BASE_CACHE_KEY }}-${{ runner.os }}

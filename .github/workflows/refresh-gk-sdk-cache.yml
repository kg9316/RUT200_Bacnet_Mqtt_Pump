name: Prepare Clean RUT2M SDK Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: RUT2M
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      SDK_URL: https://firmware.teltonika-networks.com/7.24.2/RUT2M/RUT2M_R_GPL_00.07.24.2.tar.gz
      SDK_ARCHIVE: RUT2M_R_GPL_00.07.24.2.tar.gz
      CACHE_KEY: gk-prepared-sdk-RUT2M-00.07.24.2-v3-clean-rut2m

    steps:
      - uses: actions/checkout@v4

      - name: Install SDK prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils binutils-gold bison build-essential bzip2 ca-certificates curl cmake \
            default-jdk device-tree-compiler devscripts ecj file flex fuse g++ gawk gcc gcovr \
            gengetopt gettext git gnupg groff gperf help2man java-wrappers jq libc6-dev \
            libffi-dev libexpat-dev libncurses5-dev libpcre3-dev libsqlite3-dev libssl-dev \
            libxml-parser-perl lz4 liblz4-dev libzstd-dev make ocaml ocaml-findlib ocaml-nox \
            patch pkg-config psmisc python-is-python3 python3.11 python3.11-dev python3-setuptools \
            python3-yaml rsync ruby sharutils subversion swig u-boot-tools unzip uuid-dev \
            vim-common wget zip zlib1g-dev gcc-multilib g++-multilib

      - name: Download exact RUT2M GPL SDK
        run: |
          set -euo pipefail
          rm -rf sdk
          curl -fL --retry 5 --retry-delay 5 "$SDK_URL" -o "$RUNNER_TEMP/$SDK_ARCHIVE"
          ls -lh "$RUNNER_TEMP/$SDK_ARCHIVE"
          sha256sum "$RUNNER_TEMP/$SDK_ARCHIVE"
          mkdir sdk
          tar -xzf "$RUNNER_TEMP/$SDK_ARCHIVE" -C sdk --strip-components=1
          test -f sdk/include/toplevel.mk
          test -x sdk/scripts/feeds

      - name: Print RUT2M SDK identity
        working-directory: sdk
        run: |
          set -euo pipefail
          grep -E '^(CONFIG_TARGET_|CONFIG_ARCH|CONFIG_TARGET_ARCH_PACKAGES)' .config 2>/dev/null | head -80 || true

      - name: Prepare feeds, toolchain and runtime libraries
        working-directory: sdk
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          make defconfig
          make tools/install -j2
          make toolchain/install -j2
          make package/mosquitto/compile -j2

          LIBBACNET="$(find package/teltonika/libs/lib-bacnet -type f -name 'libbacnet.so' | head -1 || true)"
          if test -z "$LIBBACNET"; then
            make package/teltonika/libs/lib-bacnet/compile -j2 V=s
          fi
          LIBBACNET="$(find package/teltonika/libs/lib-bacnet -type f -name 'libbacnet.so' | head -1)"
          test -f "$LIBBACNET"
          echo "Teltonika libbacnet=$LIBBACNET"

      - name: Inject GK packages and lib-bacnet dependency shim
        run: |
          set -euo pipefail
          rm -rf \
            sdk/package/custom/lib-bacnet \
            sdk/package/custom/gk-bacnet-mqtt \
            sdk/package/custom/vuci-app-gk-bacnet-mqtt-api \
            sdk/package/custom/vuci-app-gk-bacnet-mqtt-ui

          mkdir -p sdk/package/custom/lib-bacnet
          cp package/build-shims/lib-bacnet/Makefile sdk/package/custom/lib-bacnet/Makefile

          mkdir -p sdk/package/custom/gk-bacnet-mqtt/files
          cp package/gk-bacnet-mqtt/Makefile sdk/package/custom/gk-bacnet-mqtt/Makefile
          cp -a package/gk-bacnet-mqtt/files/. sdk/package/custom/gk-bacnet-mqtt/files/
          cp -a package/vuci-app-gk-bacnet-mqtt-api sdk/package/custom/
          cp -a package/vuci-app-gk-bacnet-mqtt-ui sdk/package/custom/

      - name: Register GK packages and verify RUT2M target
        working-directory: sdk
        run: |
          set -euo pipefail
          rm -rf tmp
          make defconfig

          grep -q '^Package: lib-bacnet$' tmp/.packageinfo
          grep -q '^Package: gk-bacnet-mqtt$' tmp/.packageinfo
          grep -q '^Package: vuci-app-gk-bacnet-mqtt-api$' tmp/.packageinfo
          grep -q '^Package: vuci-app-gk-bacnet-mqtt-ui$' tmp/.packageinfo

          sed -i '/^CONFIG_PACKAGE_gk-bacnet-mqtt=/d' .config
          sed -i '/^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-api=/d' .config
          sed -i '/^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-ui=/d' .config
          printf '%s\n' \
            'CONFIG_PACKAGE_gk-bacnet-mqtt=m' \
            'CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-api=m' \
            'CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-ui=m' >> .config
          make defconfig

          grep -E '^(CONFIG_TARGET_|CONFIG_ARCH|CONFIG_TARGET_ARCH_PACKAGES)' .config | head -100 || true
          grep '^CONFIG_PACKAGE_.*gk-bacnet-mqtt' .config
          grep -q '^CONFIG_PACKAGE_gk-bacnet-mqtt=m' .config
          grep -q '^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-api=m' .config
          grep -q '^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-ui=m' .config

          TOOLCHAIN_DIR="$(find staging_dir -maxdepth 1 -type d -name 'toolchain-*' | head -1)"
          CC="$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name '*-gcc' | head -1)"
          test -x "$CC"
          "$CC" -dumpmachine

          LIBBACNET="$(find package/teltonika/libs/lib-bacnet -type f -name 'libbacnet.so' | head -1)"
          test -f "$LIBBACNET"
          echo "Teltonika libbacnet=$LIBBACNET"

      - name: Save clean RUT2M SDK cache
        uses: actions/cache/save@v4
        with:
          path: sdk
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}

      - name: Print cache key
        run: echo "NEW CACHE=${CACHE_KEY}-${{ runner.os }}"

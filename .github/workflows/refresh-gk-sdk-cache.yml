name: Prepare Fast RUT2M SDK Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: RUT2M
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      SDK_URL: https://firmware.teltonika-networks.com/7.24.2/RUT2M/RUT2M_R_GPL_00.07.24.2.tar.gz
      SDK_ARCHIVE: RUT2M_R_GPL_00.07.24.2.tar.gz
      CACHE_KEY: gk-prepared-sdk-RUT2M-00.07.24.2-v5-vuci-prebuilt

    steps:
      - uses: actions/checkout@v4

      - name: Install SDK prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils binutils-gold bison build-essential bzip2 ca-certificates curl cmake \
            default-jdk device-tree-compiler devscripts ecj file flex fuse g++ gawk gcc gcovr \
            gengetopt gettext git gnupg groff gperf help2man java-wrappers jq libc6-dev \
            libffi-dev libexpat-dev libncurses5-dev libpcre3-dev libsqlite3-dev libssl-dev \
            libxml-parser-perl lz4 liblz4-dev libzstd-dev make ocaml ocaml-findlib ocaml-nox \
            patch pkg-config psmisc python-is-python3 python3.11 python3.11-dev python3-setuptools \
            python3-yaml rsync ruby sharutils subversion swig u-boot-tools unzip uuid-dev \
            vim-common wget zip zlib1g-dev gcc-multilib g++-multilib

      - name: Download exact RUT2M GPL SDK
        run: |
          set -euo pipefail
          rm -rf sdk
          curl -fL --retry 5 --retry-delay 5 "$SDK_URL" -o "$RUNNER_TEMP/$SDK_ARCHIVE"
          mkdir sdk
          tar -xzf "$RUNNER_TEMP/$SDK_ARCHIVE" -C sdk --strip-components=1
          test -f sdk/include/toplevel.mk
          test -x sdk/scripts/feeds

      # IMPORTANT: everything below this point is deliberately ordered so that
      # our own GK package/target mistakes fail BEFORE tools/toolchain/VuCI builds.
      - name: Refresh feeds metadata
        working-directory: sdk
        run: |
          set -euo pipefail
          ./scripts/feeds update -a

      - name: Inject GK packages in real SDK locations
        run: |
          set -euo pipefail
          rm -rf \
            sdk/package/custom/lib-bacnet \
            sdk/package/custom/gk-bacnet-mqtt \
            sdk/package/custom/vuci-app-gk-bacnet-mqtt-api \
            sdk/package/custom/vuci-app-gk-bacnet-mqtt-ui \
            sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-api \
            sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-ui

          mkdir -p sdk/package/custom/lib-bacnet
          cp package/build-shims/lib-bacnet/Makefile sdk/package/custom/lib-bacnet/Makefile
          cp -a package/gk-bacnet-mqtt sdk/package/custom/
          cp -a package/vuci-app-gk-bacnet-mqtt-api sdk/package/feeds/vuci/
          cp -a package/vuci-app-gk-bacnet-mqtt-ui sdk/package/feeds/vuci/

          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('sdk/ipk_packages.json')
          data = json.loads(p.read_text())
          data['vuci-app-gk-bacnet-mqtt-ui'] = {
              'name': 'gk_bacnet_mqtt',
              'vuci_dep': 'vuci-app-gk-bacnet-mqtt-api'
          }
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: FAIL FAST - register GK packages and prove logical targets
        working-directory: sdk
        run: |
          set -euo pipefail
          rm -rf tmp
          make defconfig

          echo '=== Verify GK package metadata ==='
          for pkg in lib-bacnet gk-bacnet-mqtt vuci-app-gk-bacnet-mqtt-api vuci-app-gk-bacnet-mqtt-ui; do
            grep -q "^Package: ${pkg}$" tmp/.packageinfo || {
              echo "MISSING PACKAGE METADATA: $pkg"
              exit 1
            }
            echo "OK: $pkg"
          done

          echo '=== Select GK packages ==='
          for sym in \
            CONFIG_PACKAGE_gk-bacnet-mqtt \
            CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-api \
            CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-ui
          do
            sed -i "/^${sym}=/d;/^# ${sym} is not set$/d" .config
            echo "${sym}=m" >> .config
          done
          make defconfig

          grep -q '^CONFIG_PACKAGE_gk-bacnet-mqtt=m' .config
          grep -q '^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-api=m' .config
          grep -q '^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-ui=m' .config

          echo '=== Prove OpenWrt logical compile targets ==='
          # Teltonika/OpenWrt logical targets are package/<name>/compile.
          # DO NOT use package/feeds/vuci/<name>/compile here.
          make -n package/gk-bacnet-mqtt/compile >/dev/null
          make -n package/vuci-app-gk-bacnet-mqtt-api/compile >/dev/null
          make -n package/vuci-app-gk-bacnet-mqtt-ui/compile >/dev/null
          echo 'GK package registration and all logical targets are OK.'

      - name: Build expensive SDK prerequisites
        working-directory: sdk
        run: |
          set -euo pipefail
          make tools/install -j2
          make toolchain/install -j2
          make package/mosquitto/compile -j2

          LIBBACNET="$(find package/teltonika/libs/lib-bacnet -type f -name 'libbacnet.so' | head -1 || true)"
          if test -z "$LIBBACNET"; then
            make package/teltonika/libs/lib-bacnet/compile -j2 V=s
          fi
          test -f "$(find package/teltonika/libs/lib-bacnet -type f -name 'libbacnet.so' | head -1)"

      - name: Prebuild VuCI core once for fast builds
        working-directory: sdk
        run: |
          set -euo pipefail
          make package/vuci-ui-core/compile -j2 V=s
          VUCI_CORE="$(find build_dir -maxdepth 1 -type d -name 'vuci-ui-core-*' | head -1)"
          test -n "$VUCI_CORE"
          test -d "$VUCI_CORE"
          echo "Cached VuCI core: $VUCI_CORE"

      - name: Save prebuilt RUT2M SDK cache
        uses: actions/cache/save@v4
        with:
          path: sdk
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}

      - name: Print cache key
        run: echo "NEW CACHE=${CACHE_KEY}-${{ runner.os }}"

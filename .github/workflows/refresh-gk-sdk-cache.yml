name: Refresh GK RutOS SDK Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: ${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: RUT2M
            old_cache_key: gk-prepared-sdk-RUT2M-00.07.24.2-v1
            new_cache_key: gk-prepared-sdk-RUT2M-00.07.24.2-v2-vuci
          - target: RUT14X
            old_cache_key: gk-prepared-sdk-RUT14X-00.07.24.2-v1
            new_cache_key: gk-prepared-sdk-RUT14X-00.07.24.2-v2-vuci

    steps:
      - uses: actions/checkout@v4

      - name: Restore old prepared SDK cache
        id: old-cache
        uses: actions/cache/restore@v4
        with:
          path: sdk
          key: ${{ matrix.old_cache_key }}-${{ runner.os }}

      - name: Verify restored SDK
        run: |
          set -euo pipefail
          echo "cache-hit=${{ steps.old-cache.outputs.cache-hit }}"
          test "${{ steps.old-cache.outputs.cache-hit }}" = "true"
          test -d sdk
          test -f sdk/include/toplevel.mk
          test -f sdk/include/package.mk

      - name: Inject GK package definitions into SDK
        run: |
          set -euo pipefail

          rm -rf \
            sdk/package/custom/gk-bacnet-mqtt \
            sdk/package/custom/lib-bacnet \
            sdk/package/custom/vuci-app-gk-bacnet-mqtt-api \
            sdk/package/custom/vuci-app-gk-bacnet-mqtt-ui

          mkdir -p \
            sdk/package/custom/gk-bacnet-mqtt/files \
            sdk/package/custom/lib-bacnet

          cp package/gk-bacnet-mqtt/Makefile sdk/package/custom/gk-bacnet-mqtt/Makefile
          cp -a package/gk-bacnet-mqtt/files/. sdk/package/custom/gk-bacnet-mqtt/files/
          cp package/build-shims/lib-bacnet/Makefile sdk/package/custom/lib-bacnet/Makefile

          # API/UI are now standalone OpenWrt packages and do not depend on
          # Teltonika's api.mk/app.mk registration helpers.
          cp -a package/vuci-app-gk-bacnet-mqtt-api sdk/package/custom/
          cp -a package/vuci-app-gk-bacnet-mqtt-ui sdk/package/custom/

          echo "=== injected GK package Makefiles ==="
          find sdk/package/custom -maxdepth 2 -name Makefile -print | sort

          test -f sdk/package/custom/vuci-app-gk-bacnet-mqtt-api/Makefile
          test -f sdk/package/custom/vuci-app-gk-bacnet-mqtt-ui/Makefile

      - name: Regenerate package metadata
        working-directory: sdk
        run: |
          set -euo pipefail

          rm -rf tmp
          make defconfig

          echo "=== GK package metadata ==="
          grep -n -E '^Package: (gk-bacnet-mqtt|vuci-app-gk-bacnet-mqtt-(api|ui))$' tmp/.packageinfo || true

          grep -q '^Package: gk-bacnet-mqtt$' tmp/.packageinfo
          grep -q '^Package: vuci-app-gk-bacnet-mqtt-api$' tmp/.packageinfo
          grep -q '^Package: vuci-app-gk-bacnet-mqtt-ui$' tmp/.packageinfo

      - name: Enable GK packages in cached SDK
        working-directory: sdk
        run: |
          set -euo pipefail

          sed -i '/^CONFIG_PACKAGE_gk-bacnet-mqtt=/d' .config
          sed -i '/^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-api=/d' .config
          sed -i '/^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-ui=/d' .config

          printf '%s\n' \
            'CONFIG_PACKAGE_gk-bacnet-mqtt=m' \
            'CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-api=m' \
            'CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-ui=m' >> .config

          make defconfig

          echo "=== selected GK packages ==="
          grep '^CONFIG_PACKAGE_.*gk-bacnet-mqtt' .config || true

          grep -q '^CONFIG_PACKAGE_gk-bacnet-mqtt=m' .config
          grep -q '^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-api=m' .config
          grep -q '^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-ui=m' .config

      - name: Save refreshed SDK cache
        uses: actions/cache/save@v4
        with:
          path: sdk
          key: ${{ matrix.new_cache_key }}-${{ runner.os }}

      - name: Print new cache key
        run: |
          echo "NEW CACHE: ${{ matrix.new_cache_key }}-${{ runner.os }}"

name: Refresh GK RutOS SDK Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: ${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: RUT2M
            old_cache_key: gk-prepared-sdk-RUT2M-00.07.24.2-v1
            new_cache_key: gk-prepared-sdk-RUT2M-00.07.24.2-v2-vuci
          - target: RUT14X
            old_cache_key: gk-prepared-sdk-RUT14X-00.07.24.2-v1
            new_cache_key: gk-prepared-sdk-RUT14X-00.07.24.2-v2-vuci

    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gawk git gettext libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget curl

      - name: Restore old prepared SDK cache
        id: old-cache
        uses: actions/cache/restore@v4
        with:
          path: sdk
          key: ${{ matrix.old_cache_key }}-${{ runner.os }}

      - name: Require exact old cache hit
        run: |
          set -euo pipefail
          echo "cache-hit=${{ steps.old-cache.outputs.cache-hit }}"
          test "${{ steps.old-cache.outputs.cache-hit }}" = "true"
          test -d sdk
          test -x sdk/scripts/feeds
          test -d sdk/feeds/packages
          test -d sdk/feeds/vuci

      - name: Install cached luasrcdiet and build host tool
        working-directory: sdk
        run: |
          set -euo pipefail

          # IMPORTANT: do not update any feed from the network. This SDK is tied
          # to its shipped feed revisions. Updating packages can generate Kconfig
          # incompatible with RutOS 00.07.24.2 (for example ntfs-3g).
          test -f feeds/packages/lang/luasrcdiet/Makefile

          rm -rf package/feeds/packages/luasrcdiet
          ./scripts/feeds install -p packages luasrcdiet
          test -f package/feeds/packages/luasrcdiet/Makefile

          echo "Building luasrcdiet host dependency from cached feed revision"
          make package/feeds/packages/luasrcdiet/host/compile -j1 V=s
          test -x staging_dir/hostpkg/bin/luasrcdiet

      - name: Add GK packages to restored SDK
        run: |
          set -euo pipefail

          rm -rf \
            sdk/package/custom/gk-bacnet-mqtt \
            sdk/package/custom/lib-bacnet \
            sdk/feeds/vuci/vuci-app-gk-bacnet-mqtt-api \
            sdk/feeds/vuci/vuci-app-gk-bacnet-mqtt-ui \
            sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-api \
            sdk/package/feeds/vuci/vuci-app-gk-bacnet-mqtt-ui

          mkdir -p \
            sdk/package/custom/gk-bacnet-mqtt/files \
            sdk/package/custom/lib-bacnet

          cp package/gk-bacnet-mqtt/Makefile sdk/package/custom/gk-bacnet-mqtt/Makefile
          cp -a package/gk-bacnet-mqtt/files/. sdk/package/custom/gk-bacnet-mqtt/files/
          cp package/build-shims/lib-bacnet/Makefile sdk/package/custom/lib-bacnet/Makefile

          # Add our VuCI packages to the SOURCE feed, not directly to package/feeds.
          cp -a package/vuci-app-gk-bacnet-mqtt-api sdk/feeds/vuci/
          cp -a package/vuci-app-gk-bacnet-mqtt-ui sdk/feeds/vuci/

          test -f sdk/feeds/vuci/vuci-app-gk-bacnet-mqtt-api/Makefile
          test -f sdk/feeds/vuci/vuci-app-gk-bacnet-mqtt-ui/Makefile

      - name: Re-index local VuCI feed and install only GK VuCI packages
        working-directory: sdk
        run: |
          set -euo pipefail

          # -i regenerates the feed index from the already present local feed tree;
          # it does not pull a newer feed revision from the network.
          ./scripts/feeds update -i vuci

          ./scripts/feeds install -f -p vuci vuci-app-gk-bacnet-mqtt-api
          ./scripts/feeds install -f -p vuci vuci-app-gk-bacnet-mqtt-ui

          test -e package/feeds/vuci/vuci-app-gk-bacnet-mqtt-api
          test -e package/feeds/vuci/vuci-app-gk-bacnet-mqtt-ui

          echo "=== installed GK VuCI feed packages ==="
          ls -ld package/feeds/vuci/vuci-app-gk-bacnet-mqtt-*

      - name: Regenerate package metadata and verify GK VuCI packages
        working-directory: sdk
        run: |
          set -euo pipefail

          rm -rf tmp
          make defconfig

          echo "=== GK package metadata ==="
          grep -R -n -E 'Package: (gk-bacnet-mqtt|vuci-app-gk-bacnet-mqtt-(api|ui))' \
            tmp/.packageinfo* tmp/pkginfo* 2>/dev/null || true

          grep -R -q 'Package: vuci-app-gk-bacnet-mqtt-api' tmp 2>/dev/null
          grep -R -q 'Package: vuci-app-gk-bacnet-mqtt-ui' tmp 2>/dev/null

          printf '%s\n' \
            'CONFIG_PACKAGE_gk-bacnet-mqtt=m' \
            'CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-api=m' \
            'CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-ui=m' >> .config

          make defconfig

          echo "=== Selected GK packages ==="
          grep '^CONFIG_PACKAGE_.*gk-bacnet-mqtt' .config || true

          grep -q '^CONFIG_PACKAGE_gk-bacnet-mqtt=m' .config
          grep -q '^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-api=m' .config
          grep -q '^CONFIG_PACKAGE_vuci-app-gk-bacnet-mqtt-ui=m' .config

      - name: Save refreshed SDK cache
        uses: actions/cache/save@v4
        with:
          path: sdk
          key: ${{ matrix.new_cache_key }}-${{ runner.os }}

      - name: Print new cache key
        run: |
          echo "NEW CACHE: ${{ matrix.new_cache_key }}-${{ runner.os }}"

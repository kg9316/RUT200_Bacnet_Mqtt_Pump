name: 0 - Validate GK Build Workflows

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflow contract
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Verify required project package files
        run: |
          set -euo pipefail
          test -f package/gk-bacnet-mqtt/Makefile
          test -f package/vuci-app-gk-bacnet-mqtt-api/Makefile
          test -f package/vuci-app-gk-bacnet-mqtt-ui/Makefile

      - name: Verify cache chain names
        run: |
          set -euo pipefail
          grep -q 'BASE_CACHE_KEY: gk-sdk-base-RUT2M-00.07.24.2-v2' .github/workflows/prepare-sdk-base.yml
          grep -q 'BASE_CACHE_KEY: gk-sdk-base-RUT2M-00.07.24.2-v2' .github/workflows/prepare-vuci-cache.yml
          grep -q 'VUCI_CACHE_KEY: gk-sdk-vuci-RUT2M-00.07.24.2-v2' .github/workflows/prepare-vuci-cache.yml
          grep -q 'VUCI_CACHE_KEY: gk-sdk-vuci-RUT2M-00.07.24.2-v2' .github/workflows/build-gk-fast.yml

      - name: Enforce Fast Build cache preservation
        run: |
          set -euo pipefail
          FAST=.github/workflows/build-gk-fast.yml

          reject() {
            pattern="$1"
            if grep -En "$pattern" "$FAST"; then
              echo "FORBIDDEN IN FAST BUILD: $pattern"
              exit 1
            fi
          }

          reject 'rm -rf (sdk/)?tmp'
          reject 'make defconfig'
          reject 'scripts/feeds (update|install)'
          reject 'make (tools|toolchain)/install'
          reject 'package/vuci-ui-core/(clean|compile)'
          reject 'make clean'
          reject 'gk-prepared-sdk-RUT2M-00\\.07\\.24\\.2-v[0-9]'

          # Fast Build ships one standalone UI package containing the daemon.
          grep -q 'package/vuci-app-gk-bacnet-mqtt-ui/compile' "$FAST"

          echo 'Fast Build contract OK.'

  mqtt-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libcurl4-openssl-dev libjson-c-dev libmosquitto-dev lua5.1
      - name: Fetch matching BACnet headers
        run: |
          curl -fsSL https://github.com/bacnet-stack/bacnet-stack/archive/refs/tags/bacnet-stack-1.3.8.tar.gz -o "$RUNNER_TEMP/bacnet.tar.gz"
          mkdir "$RUNNER_TEMP/bacnet"
          tar -xzf "$RUNNER_TEMP/bacnet.tar.gz" -C "$RUNNER_TEMP/bacnet" --strip-components=1
      - name: Test protocol, GUID persistence, credentials and UI
        run: |
          set -euo pipefail
          cc -I"$RUNNER_TEMP/bacnet/src" tests/test_cloud.c -lcurl -ljson-c -lm -o "$RUNNER_TEMP/test-cloud"
          "$RUNNER_TEMP/test-cloud"
          cc -I"$RUNNER_TEMP/bacnet/src" tests/test_mqtt.c -o "$RUNNER_TEMP/test-mqtt"
          "$RUNNER_TEMP/test-mqtt"
          cc -I"$RUNNER_TEMP/bacnet/src" tests/test_status.c -ljson-c -lm -o "$RUNNER_TEMP/test-status"
          "$RUNNER_TEMP/test-status"
          cc -I"$RUNNER_TEMP/bacnet/src" tests/test_device_table.c -o "$RUNNER_TEMP/test-device-table"
          "$RUNNER_TEMP/test-device-table"
          lua5.1 tests/test_api.lua package/vuci-app-gk-bacnet-mqtt-api/files/usr/lib/lua/api/services/gk_bacnet_mqtt_config.lua
          node tests/test_ui.cjs package/vuci-app-gk-bacnet-mqtt-ui/src/src/views/services/GkBacnetMqtt.vue
